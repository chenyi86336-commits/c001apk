          /**
           * 动态信息流列表页：针对 Galaxy Watch 7 圆屏优化的高对比度圆角卡片与一键刷新
           */
          @Composable
          fun WatchFeedListScreen(
              tabType: String,
              sessId: String,
              fontScale: Float,
              onFeedClick: (WearFeedItem) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 1)
              val horizontalPad = rememberWatchHorizontalPadding()
              val coroutineScope = rememberCoroutineScope()
              val view = LocalView.current

              var feeds by remember { mutableStateOf<List<WearFeedItem>>(emptyList()) }
              var isLoading by remember { mutableStateOf(true) }
              var page by remember { mutableIntStateOf(1) }

              val (tabTitle, accentColor) = remember(tabType) {
                  when (tabType) {
                      "hot" -> "今日热榜" to WatchWarmOrange
                      "watch" -> "圆表专区" to WatchSkyBlue
                      "digital" -> "数码广场" to WatchPurple
                      else -> "酷安头条" to WatchPrimaryGreen
                  }
              }

              fun loadData(targetPage: Int, force: Boolean = false) {
                  coroutineScope.launch {
                      isLoading = true
                      val result = CoolapkRepository.fetchFeeds(tabType, targetPage, sessId, force)
                      feeds = if (targetPage == 1) result else (feeds + result).distinctBy { it.id }
                      isLoading = false
                  }
              }

              LaunchedEffect(tabType) {
                  loadData(1, force = false)
              }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 1),
                      scalingParams = ScalingLazyColumnDefaults.scalingParams(
                          edgeScale = 0.68f,
                          edgeAlpha = 0.45f
                      ),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      // 顶部频道标题 + 右侧迷你刷新圆钮
                      item(key = "list_header") {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center,
                              modifier = Modifier
                                  .clip(CircleShape)
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, accentColor.copy(alpha = 0.35f), CircleShape)
                                  .clickable {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      page = 1
                                      loadData(1, force = true)
                                  }
                                  .padding(horizontal = 14.dp, vertical = 5.dp)
                          ) {
                              Text(
                                  text = tabTitle,
                                  color = accentColor,
                                  fontSize = (13 * fontScale).sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(modifier = Modifier.width(6.dp))
                              Icon(
                                  imageVector = Icons.Default.Refresh,
                                  contentDescription = "刷新",
                                  tint = accentColor,
                                  modifier = Modifier.size(14.dp)
                              )
                          }
                      }

                      if (isLoading && feeds.isEmpty()) {
                          item(key = "loading") {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 26.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  CircularProgressIndicator(
                                      indicatorColor = accentColor,
                                      trackColor = WatchSurfaceElevated,
                                      strokeWidth = 3.dp,
                                      modifier = Modifier.size(34.dp)
                                  )
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(
                                      text = "正在同步酷安动态...",
                                      color = WatchTextSecondary,
                                      fontSize = 11.sp
                                  )
                              }
                          }
                      } else {
                          items(
                              items = feeds,
                              key = { it.id }
                          ) { item ->
                              GoogleWearFeedCard(
                                  item = item,
                                  accentColor = accentColor,
                                  fontScale = fontScale,
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      onFeedClick(item)
                                  }
                              )
                          }

                          item(key = "load_more") {
                              CompactChip(
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      page += 1
                                      loadData(page, force = true)
                                  },
                                  label = {
                                      Text(
                                          text = if (isLoading) "加载中..." else "加载下一页",
                                          fontSize = (12 * fontScale).sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                  },
                                  icon = {
                                      Icon(
                                          imageVector = Icons.Default.ExpandMore,
                                          contentDescription = null,
                                          modifier = Modifier.size(16.dp)
                                      )
                                  },
                                  colors = ChipDefaults.primaryChipColors(
                                      backgroundColor = accentColor,
                                      contentColor = Color.Black
                                  )
                              )
                          }
                      }
                  }
              }
          }

          /**
           * 参考 Google Keep / Google News Wear OS 设计的圆表信息卡片
           * 大圆角 (24dp) 贴合圆形表盘边缘 + 头像首字母徽章 + 清晰双行摘要 + 底部胶囊数据标
           */
          @Composable
          fun GoogleWearFeedCard(
              item: WearFeedItem,
              accentColor: Color,
              fontScale: Float,
              onClick: () -> Unit
          ) {
              Card(
                  onClick = onClick,
                  modifier = Modifier
                      .fillMaxWidth()
                      .border(1.dp, WatchBorderSubtle, RoundedCornerShape(24.dp)),
                  shape = RoundedCornerShape(24.dp),
                  backgroundPainter = CardDefaults.cardBackgroundPainter(
                      startBackgroundColor = WatchSurfaceElevated,
                      endBackgroundColor = WatchSurfaceCard
                  ),
                  contentPadding = PaddingValues(horizontal = 14.dp, vertical = 11.dp)
              ) {
                  Column(verticalArrangement = Arrangement.spacedBy(5.dp)) {
                      // 顶部作者栏：圆形头像/首字母球 + 用户名 + 机型标签
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.weight(1f)
                          ) {
                              UserAvatarBadge(
                                  avatarUrl = item.userAvatar,
                                  username = item.username,
                                  accentColor = accentColor,
                                  size = 20.dp
                              )
                              Spacer(modifier = Modifier.width(6.dp))
                              Text(
                                  text = item.username,
                                  fontSize = (11 * fontScale).sp,
                                  color = WatchTextSecondary,
                                  fontWeight = FontWeight.Medium,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }

                          // 点赞胶囊小徽章
                          Box(
                              modifier = Modifier
                                  .clip(CircleShape)
                                  .background(accentColor.copy(alpha = 0.16f))
                                  .padding(horizontal = 7.dp, vertical = 2.dp)
                          ) {
                              Text(
                                  text = "赞 ${item.likeNum}",
                                  fontSize = (9.5f * fontScale).sp,
                                  color = accentColor,
                                  fontWeight = FontWeight.Bold
                              )
                          }
                      }

                      // 标题（加粗高对比度白色）
                      Text(
                          text = item.title,
                          fontSize = (13.5f * fontScale).sp,
                          fontWeight = FontWeight.Bold,
                          color = WatchTextPrimary,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                          lineHeight = (17.5f * fontScale).sp
                      )

                      // 摘要（柔和灰白，一屏信息适中不拥挤）
                      Text(
                          text = item.messagePlain,
                          fontSize = (11.5f * fontScale).sp,
                          color = Color(0xFFCBD5E1),
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                          lineHeight = (15.5f * fontScale).sp
                      )

                      // 底部状态行：设备小尾巴 + 评论数
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = item.deviceTitle,
                              fontSize = (9.5f * fontScale).sp,
                              color = Color(0xFF64748B),
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(
                                  imageVector = Icons.Outlined.ChatBubbleOutline,
                                  contentDescription = null,
                                  tint = WatchSkyBlue,
                                  modifier = Modifier.size(11.dp)
                              )
                              Spacer(modifier = Modifier.width(3.dp))
                              Text(
                                  text = "${item.replyNum}",
                                  fontSize = (10 * fontScale).sp,
                                  color = WatchSkyBlue,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun UserAvatarBadge(
              avatarUrl: String,
              username: String,
              accentColor: Color,
              size: Dp
          ) {
              val context = LocalContext.current
              Box(
                  modifier = Modifier
                      .size(size)
                      .clip(CircleShape)
                      .background(accentColor.copy(alpha = 0.25f)),
                  contentAlignment = Alignment.Center
              ) {
                  val initial = username.firstOrNull()?.toString() ?: "酷"
                  Text(
                      text = initial,
                      color = accentColor,
                      fontSize = 10.sp,
                      fontWeight = FontWeight.Bold
                  )
                  if (avatarUrl.isNotBlank()) {
                      AsyncImage(
                          model = ImageRequest.Builder(context)
                              .data(avatarUrl)
                              .size(64) // 限制解码分辨率为 64x64，极大节省手表内存并提升滑动帧率
                              .crossfade(false)
                              .build(),
                          contentDescription = username,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  }
              }
          }

          /**
           * 详情阅读页：专为圆形屏幕打造的沉浸式阅读器（支持配图缩略图、无 WebView 手机接力、圆形操作坞）
           */
          @Composable
          fun WatchFeedDetailScreen(
              feed: WearFeedItem,
              sessId: String,
              fontScale: Float,
              isBookmarked: Boolean,
              onToggleBookmark: () -> Unit
          ) {
              val context = LocalContext.current
              val view = LocalView.current
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 0)
              val horizontalPad = rememberWatchHorizontalPadding()

              var replies by remember { mutableStateOf<List<WearReplyItem>>(emptyList()) }
              var isLiked by remember { mutableStateOf(false) }
              var statusToast by remember { mutableStateOf("") }

              LaunchedEffect(feed.id) {
                  replies = CoolapkRepository.fetchReplies(feed.id, sessId)
              }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 0),
                      scalingParams = ScalingLazyColumnDefaults.scalingParams(
                          edgeScale = 0.72f,
                          edgeAlpha = 0.5f
                      ),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      // 0. 顶部作者胶囊与标题
                      item(key = "detail_header") {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 6.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier
                                      .clip(CircleShape)
                                      .background(WatchSurfaceCard)
                                      .padding(horizontal = 10.dp, vertical = 3.dp)
                              ) {
                                  UserAvatarBadge(
                                      avatarUrl = feed.userAvatar,
                                      username = feed.username,
                                      accentColor = WatchPrimaryGreen,
                                      size = 16.dp
                                  )
                                  Spacer(modifier = Modifier.width(5.dp))
                                  Text(
                                      text = feed.username,
                                      color = WatchPrimaryGreen,
                                      fontSize = (11 * fontScale).sp,
                                      fontWeight = FontWeight.SemiBold,
                                      maxLines = 1
                                  )
                              }
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = feed.title,
                                  color = WatchTextPrimary,
                                  fontSize = (14.5f * fontScale).sp,
                                  fontWeight = FontWeight.Bold,
                                  textAlign = TextAlign.Center,
                                  lineHeight = (19 * fontScale).sp
                              )
                          }
                      }

                      // 1. 正文大圆角卡片（针对圆屏优化内边距，绝不贴边裁切）
                      item(key = "detail_body") {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, WatchBorderSubtle, RoundedCornerShape(22.dp))
                                  .padding(horizontal = 14.dp, vertical = 12.dp)
                          ) {
                              Text(
                                  text = feed.fullContentPlain,
                                  color = WatchTextPrimary,
                                  fontSize = (13 * fontScale).sp,
                                  lineHeight = (19.5f * fontScale).sp
                              )
                          }
                      }

                      // 2. 如果帖子带有图片，使用低内存圆角缩略图展示（限制解码尺寸保证流畅）
                      if (feed.picUrls.isNotEmpty()) {
                          items(
                              items = feed.picUrls,
                              key = { it }
                          ) { picUrl ->
                              AsyncImage(
                                  model = ImageRequest.Builder(context)
                                      .data(picUrl)
                                      .size(320) // 针对 Watch 7 屏幕限制图片像素，杜绝大图 OOM 闪退
                                      .crossfade(true)
                                      .build(),
                                  contentDescription = "配图",
                                  contentScale = ContentScale.Crop,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(110.dp)
                                      .clip(RoundedCornerShape(20.dp))
                                      .background(WatchSurfaceElevated)
                              )
                          }
                      }

                      // 3. 外部网页链接安全降级胶囊（无 WebView 保护，一键投送到三星手机浏览器）
                      if (feed.infoHtmlLinks.isNotEmpty()) {
                          items(
                              items = feed.infoHtmlLinks,
                              key = { it.second }
                          ) { (label, url) ->
                              CompactChip(
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.CONFIRM)
                                      HtmlSanitizerForWear.openUrlSafelyOnWatch(context, url) { msg ->
                                          statusToast = msg
                                      }
                                  },
                                  label = {
                                      Text(
                                          text = "手机打开: $label",
                                          fontSize = (11 * fontScale).sp,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  },
                                  icon = {
                                      Icon(
                                          imageVector = Icons.Default.SendToMobile,
                                          contentDescription = null,
                                          tint = WatchSkyBlue,
                                          modifier = Modifier.size(15.dp)
                                      )
                                  },
                                  colors = ChipDefaults.secondaryChipColors(
                                      backgroundColor = Color(0xFF0E253B),
                                      contentColor = WatchSkyBlue
                                  )
                              )
                          }
                      }

                      // 4. Google Wear 原生风格三联交互按钮（点赞 / 离线收藏 / 手机浏览器接力）
                      item(key = "action_row") {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 4.dp),
                              horizontalArrangement = Arrangement.SpaceEvenly
                          ) {
                              QuickOrbButton(
                                  icon = Icons.Default.ThumbUp,
                                  label = if (isLiked) "已赞(${feed.likeNum + 1})" else "赞(${feed.likeNum})",
                                  tint = if (isLiked) Color.Black else WatchPrimaryGreen,
                                  bgColor = if (isLiked) WatchPrimaryGreen else Color(0xFF0F2E26),
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      isLiked = !isLiked
                                  }
                              )

                              QuickOrbButton(
                                  icon = Icons.Default.Bookmark,
                                  label = if (isBookmarked) "已收藏" else "收藏",
                                  tint = if (isBookmarked) Color.Black else WatchPink,
                                  bgColor = if (isBookmarked) WatchPink else Color(0xFF3B122B),
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      onToggleBookmark()
                                  }
                              )

                              QuickOrbButton(
                                  icon = Icons.Default.SendToMobile,
                                  label = "手机接力",
                                  tint = WatchSkyBlue,
                                  bgColor = Color(0xFF0C2D48),
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.CONFIRM)
                                      HtmlSanitizerForWear.openUrlSafelyOnWatch(context, feed.shareUrl) { msg ->
                                          statusToast = msg
                                      }
                                  }
                              )
                          }
                      }

                      if (statusToast.isNotBlank()) {
                          item(key = "toast_banner") {
                              Text(
                                  text = statusToast,
                                  color = WatchSkyBlue,
                                  fontSize = (11 * fontScale).sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(CircleShape)
                                      .background(Color(0xFF0E253B))
                                      .padding(vertical = 4.dp, horizontal = 10.dp)
                              )
                          }
                      }

                      // 5. 热门回复区
                      item(key = "reply_header") {
                          Text(
                              text = "机友热评 (${replies.size})",
                              color = WatchPrimaryGreen,
                              fontSize = (12.5f * fontScale).sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(top = 4.dp),
                              textAlign = TextAlign.Center
                          )
                      }

                      items(
                          items = replies,
                          key = { it.id }
                      ) { reply ->
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, WatchBorderSubtle, RoundedCornerShape(20.dp))
                                  .padding(horizontal = 12.dp, vertical = 10.dp)
                          ) {
                              Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          UserAvatarBadge(
                                              avatarUrl = reply.userAvatar,
                                              username = reply.username,
                                              accentColor = WatchSkyBlue,
                                              size = 16.dp
                                          )
                                          Spacer(modifier = Modifier.width(5.dp))
                                          Text(
                                              text = reply.username,
                                              color = WatchSkyBlue,
                                              fontSize = (11 * fontScale).sp,
                                              fontWeight = FontWeight.SemiBold,
                                              maxLines = 1
                                          )
                                      }
                                      Text(
                                          text = "赞 ${reply.likeNum}",
                                          color = WatchTextSecondary,
                                          fontSize = (10 * fontScale).sp
                                      )
                                  }
                                  Text(
                                      text = reply.messagePlain,
                                      color = WatchTextPrimary,
                                      fontSize = (12 * fontScale).sp,
                                      lineHeight = (16.5f * fontScale).sp
                                  )
                              }
                          }
                      }
                  }
              }
          }

          /**
           * 腕上搜索页：胶囊搜索框 + 快捷热词圆片（免打字一键搜）
           */
          @Composable
          fun WatchSearchScreen(
              sessId: String,
              fontScale: Float,
              onFeedClick: (WearFeedItem) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 1)
              val horizontalPad = rememberWatchHorizontalPadding()
              val coroutineScope = rememberCoroutineScope()
              val view = LocalView.current

              var query by remember { mutableStateOf("") }
              var searchResults by remember { mutableStateOf<List<WearFeedItem>>(emptyList()) }
              var searching by remember { mutableStateOf(false) }

              fun executeSearch(kw: String) {
                  if (kw.isBlank()) return
                  query = kw
                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                  coroutineScope.launch {
                      searching = true
                      searchResults = CoolapkRepository.searchFeeds(kw, sessId)
                      searching = false
                  }
              }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 1),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "search_title") {
                          Text(
                              text = "腕上搜索",
                              color = WatchSkyBlue,
                              fontSize = (13.5f * fontScale).sp,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      item(key = "search_box") {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(CircleShape)
                                  .background(WatchSurfaceElevated)
                                  .border(1.dp, WatchSkyBlue.copy(alpha = 0.4f), CircleShape)
                                  .padding(horizontal = 14.dp, vertical = 10.dp)
                          ) {
                              Icon(
                                  imageVector = Icons.Default.Search,
                                  contentDescription = null,
                                  tint = WatchSkyBlue,
                                  modifier = Modifier.size(16.dp)
                              )
                              Spacer(modifier = Modifier.width(6.dp))
                              BasicTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  singleLine = true,
                                  textStyle = TextStyle(
                                      color = WatchTextPrimary,
                                      fontSize = (13 * fontScale).sp
                                  ),
                                  cursorBrush = SolidColor(WatchSkyBlue),
                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                  keyboardActions = KeyboardActions(onSearch = { executeSearch(query) }),
                                  modifier = Modifier.weight(1f),
                                  decorationBox = { innerTextField ->
                                      if (query.isEmpty()) {
                                          Text(
                                              text = "输入关键词或点下方热词",
                                              color = WatchTextSecondary,
                                              fontSize = (11.5f * fontScale).sp,
                                              maxLines = 1
                                          )
                                      }
                                      innerTextField()
                                  }
                              )
                          }
                      }

                      // 专为手表小屏幕设计的免打字快捷热词胶囊
                      item(key = "hot_tags_1") {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceEvenly
                          ) {
                              listOf("Watch7", "表盘", "OneUI").forEach { tag ->
                                  CompactChip(
                                      onClick = { executeSearch(tag) },
                                      label = { Text(tag, fontSize = (11 * fontScale).sp) },
                                      colors = ChipDefaults.secondaryChipColors(
                                          backgroundColor = WatchSurfaceCard,
                                          contentColor = WatchPrimaryGreen
                                      )
                                  )
                              }
                          }
                      }

                      if (searching) {
                          item(key = "searching_indicator") {
                              CircularProgressIndicator(
                                  indicatorColor = WatchSkyBlue,
                                  strokeWidth = 3.dp,
                                  modifier = Modifier
                                      .padding(vertical = 12.dp)
                                      .size(28.dp)
                              )
                          }
                      } else {
                          items(
                              items = searchResults,
                              key = { it.id }
                          ) { item ->
                              GoogleWearFeedCard(
                                  item = item,
                                  accentColor = WatchSkyBlue,
                                  fontScale = fontScale,
                                  onClick = { onFeedClick(item) }
                              )
                          }
                      }
                  }
              }
          }

          /**
           * 本地离线收藏页
           */
          @Composable
          fun WatchBookmarksScreen(
              bookmarks: List<WearFeedItem>,
              fontScale: Float,
              onFeedClick: (WearFeedItem) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 0)
              val horizontalPad = rememberWatchHorizontalPadding()

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 0),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "bm_title") {
                          Text(
                              text = "离线收藏 (${bookmarks.size})",
                              color = WatchPink,
                              fontSize = (13.5f * fontScale).sp,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      if (bookmarks.isEmpty()) {
                          item(key = "bm_empty") {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clip(RoundedCornerShape(22.dp))
                                      .background(WatchSurfaceCard)
                                      .padding(16.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      text = "暂无收藏\n在帖子详情页点「收藏」按钮即可保存在手表中离线阅读",
                                      color = WatchTextSecondary,
                                      fontSize = (11.5f * fontScale).sp,
                                      textAlign = TextAlign.Center
                                  )
                              }
                          }
                      } else {
                          items(
                              items = bookmarks,
                              key = { it.id }
                          ) { item ->
                              GoogleWearFeedCard(
                                  item = item,
                                  accentColor = WatchPink,
                                  fontScale = fontScale,
                                  onClick = { onFeedClick(item) }
                              )
                          }
                      }
                  }
              }
          }

          /**
           * 手表设置页：调节字号比例、SESSID 凭证与 Watch 7 硬件加速说明
           */
          @Composable
          fun WatchSettingsScreen(
              fontScale: Float,
              sessId: String,
              onFontScaleChange: (Float) -> Unit,
              onSessIdChange: (String) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 1)
              val horizontalPad = rememberWatchHorizontalPadding()
              val view = LocalView.current
              var inputSess by remember { mutableStateOf(sessId) }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 1),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "set_title") {
                          Text(
                              text = "Watch 7 腕上设置",
                              color = WatchPrimaryGreen,
                              fontSize = (13.5f * fontScale).sp,
                              fontWeight = FontWeight.Bold
                          )
                      }

                      item(key = "font_scale_chip") {
                          val scaleLabel = when {
                              fontScale >= 1.2f -> "超大清晰字号 (125%)"
                              fontScale >= 1.1f -> "舒适大字号 (115%)"
                              else -> "圆表标准字号 (100%)"
                          }
                          Chip(
                              modifier = Modifier.fillMaxWidth(),
                              onClick = {
                                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  val next = when {
                                      fontScale < 1.1f -> 1.15f
                                      fontScale < 1.2f -> 1.25f
                                      else -> 1.0f
                                  }
                                  onFontScaleChange(next)
                              },
                              shape = CircleShape,
                              colors = ChipDefaults.secondaryChipColors(
                                  backgroundColor = WatchSurfaceElevated
                              ),
                              icon = {
                                  Icon(
                                      imageVector = Icons.Default.FormatSize,
                                      contentDescription = null,
                                      tint = WatchPrimaryGreen
                                  )
                              },
                              label = { Text("字体缩放比例", fontSize = (13 * fontScale).sp) },
                              secondaryLabel = { Text(scaleLabel, color = WatchPrimaryGreen, fontSize = (11 * fontScale).sp) }
                          )
                      }

                      item(key = "sess_input") {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, WatchBorderSubtle, RoundedCornerShape(20.dp))
                                  .padding(12.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  text = "免 WebView 账号 Cookie (可选)",
                                  color = WatchTextSecondary,
                                  fontSize = (10.5f * fontScale).sp
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              BasicTextField(
                                  value = inputSess,
                                  onValueChange = {
                                      inputSess = it
                                      onSessIdChange(it)
                                  },
                                  singleLine = true,
                                  textStyle = TextStyle(
                                      color = WatchTextPrimary,
                                      fontSize = (12 * fontScale).sp,
                                      textAlign = TextAlign.Center
                                  ),
                                  cursorBrush = SolidColor(WatchPrimaryGreen),
                                  decorationBox = { inner ->
                                      if (inputSess.isEmpty()) {
                                          Text(
                                              text = "点击粘贴 SESSID 或留空匿名",
                                              color = Color(0xFF64748B),
                                              fontSize = (11 * fontScale).sp
                                          )
                                      }
                                      inner()
                                  }
                              )
                          }
                      }

                      item(key = "watch7_info") {
                          Text(
                              text = "已启用 Galaxy Watch 7 圆屏防裁切曲线、触控表圈微震动与 R8 满帧加速，100% 无 WebView 零崩溃。",
                              color = WatchTextSecondary,
                              fontSize = (10 * fontScale).sp,
                              textAlign = TextAlign.Center,
                              modifier = Modifier.padding(horizontal = 8.dp)
                          )
                      }
                  }
              }
          }
          EOF

          # 7. 自动将 :wear 模块注册进 settings.gradle.kts 或 settings.gradle
          if [ -f "settings.gradle.kts" ]; then
              if ! grep -q 'include(":wear")' settings.gradle.kts; then
                  echo "" >> settings.gradle.kts
                  echo 'include(":wear")' >> settings.gradle.kts
              fi
          elif [ -f "settings.gradle" ]; then
              if ! grep -q "include ':wear'" settings.gradle; then
                  echo "" >> settings.gradle
                  echo "include ':wear'" >> settings.gradle
              fi
          fi

      - name: 5. 赋予 Gradle 执行权限并编译 Galaxy Watch 7 专属 Release APK
        run: |
          chmod +x gradlew
          ./gradlew :wear:assembleRelease --no-daemon --stacktrace

      - name: 6. 上传可直接安装到三星 Galaxy Watch 7 的 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-GalaxyWatch7-APK
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error