                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  },
                  secondaryLabel = {
                      Text(
                          text = subtitle,
                          fontSize = (11 * fontScale).sp,
                          color = WatchTextSecondary,
