name: Build Wear OS APK (Galaxy Watch 7 Edition)

# 触发条件：保存文件(push)或在手机网页上手动点击运行(workflow_dispatch)时自动开始
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wear-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Android SDK 环境
        uses: android-actions/setup-android@v3

      - name: 4. 注入 Google Wear OS 原生风格 UI 与 Galaxy Watch 7 性能优化架构
        run: |
          echo "开始构建专为 Galaxy Watch 7 圆表优化的 :wear 模块..."
          mkdir -p wear/src/main/java/com/c001apk/wear/ui
          mkdir -p wear/src/main/java/com/c001apk/wear/network
          mkdir -p wear/src/main/res/values
          mkdir -p wear/src/main/res/drawable

          # 1. 生成 Google Wear OS 风格翠绿圆表图标
          cat << 'EOF' > wear/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090D16" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#34D399" android:pathData="M54,20A34,34 0 1,0 88,54A34,34 0 0,0 54,20ZM54,74A20,20 0 1,1 74,54A20,20 0 0,1 54,74Z"/>
              <path android:fillColor="#38BDF8" android:pathData="M54,44A10,10 0 1,0 64,54A10,10 0 0,0 54,44Z"/>
          </vector>
          EOF

          # 2. 生成 ProGuard 性能优化与体积压缩规则 (R8 深度优化但保留网络反射模型)
          cat << 'EOF' > wear/proguard-rules.pro
          -keepattributes Signature, InnerClasses, EnclosingMethod
          -keepattributes RuntimeVisibleAnnotations, RuntimeVisibleParameterAnnotations
          -keepclassmembers class * {
              @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep class com.c001apk.wear.network.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          EOF

          # 3. 生成 Wear OS 专属 AndroidManifest.xml (开启硬件加速、大内存、独立手表应用声明)
          cat << 'EOF' > wear/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <!-- 声明这是 Wear OS 手表应用 -->
              <uses-feature android:name="android.hardware.type.watch" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="酷安腕上版"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <!-- 声明可独立在 Galaxy Watch 7 上运行 -->
                  <meta-data
                      android:name="com.google.android.wearable.standalone"
                      android:value="true" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:taskAffinity=""
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:theme="@android:style/Theme.DeviceDefault">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. 生成 :wear 模块的 build.gradle.kts (开启 R8 性能优化、Coil 圆形缩略图、Wear Compose 1.3.1)
          cat << 'EOF' > wear/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.c001apk.wear"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.c001apk.wear"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 200
                  versionName = "2.0.0-Watch7"
              }

              buildTypes {
                  release {
                      // 开启 R8 代码优化与资源压缩，让三星 Watch 7 满帧 60fps 丝滑运行
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.wear.compose.material.ExperimentalWearMaterialApi",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi"
                  )
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              // Google 官方 Wear OS Jetpack Compose 视觉与圆形表盘自适应库
              implementation("androidx.wear.compose:compose-material:1.3.1")
              implementation("androidx.wear.compose:compose-foundation:1.3.1")
              implementation("androidx.wear.compose:compose-navigation:1.3.1")

              // Compose 基础库与硬件加速渲染
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui:1.6.8")
              implementation("androidx.compose.ui:ui-tooling-preview:1.6.8")
              implementation("androidx.compose.material:material-icons-extended:1.6.8")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")

              // Wear OS 手机协同库（无 WebView 时一键在三星手机浏览器打开链接）
              implementation("androidx.wear:wear-remote-interactions:1.0.0")
              implementation("androidx.concurrent:concurrent-futures-ktx:1.1.0")

              // 网络层与低内存图片缓存引擎
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.11.0")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          # 5. 生成高性能网络层（预编译正则、HTTP 磁盘+内存双缓存、无 WebView 安全降级）
          cat << 'EOF' > wear/src/main/java/com/c001apk/wear/network/CoolapkNetwork.kt
          package com.c001apk.wear.network

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.util.Base64
          import android.util.LruCache
          import androidx.compose.runtime.Immutable
          import androidx.wear.remote.interactions.RemoteActivityHelper
          import com.google.gson.Gson
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Cache
          import okhttp3.ConnectionPool
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.File
          import java.security.MessageDigest
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          // 使用 @Immutable 标记数据模型，让 Compose 跳过无意义的重组计算，大幅降低 Galaxy Watch 7 功耗与掉帧
          @Immutable
          data class WearFeedItem(
              val id: String,
              val username: String,
              val userAvatar: String,
              val deviceTitle: String,
              val title: String,
              val messagePlain: String,
              val fullContentPlain: String,
              val infoHtmlLinks: List<Pair<String, String>>,
              val picUrls: List<String>,
              val likeNum: Int,
              val replyNum: Int,
              val dateline: String,
              val shareUrl: String
          )

          @Immutable
          data class WearReplyItem(
              val id: String,
              val username: String,
              val userAvatar: String,
              val messagePlain: String,
              val likeNum: Int,
              val dateline: String
          )

          object HtmlSanitizerForWear {
              // 预编译正则表达式，避免在列表滚动或解析时重复编译导致卡顿
              private val BR_REGEX = Regex("<br\\s*/?>", RegexOption.IGNORE_CASE)
              private val P_END_REGEX = Regex("</p>", RegexOption.IGNORE_CASE)
              private val TAG_REGEX = Regex("<[^>]*>")
              private val LINK_REGEX = Regex("<a[^>]+href=[\"']([^\"']+)[\"'][^>]*>(.*?)</a>", RegexOption.IGNORE_CASE)
              private val MULTI_NL_REGEX = Regex("\n{3,}")

              fun htmlToCleanText(html: String?): String {
                  if (html.isNullOrBlank()) return ""
                  return html
                      .replace(BR_REGEX, "\n")
                      .replace(P_END_REGEX, "\n\n")
                      .replace(TAG_REGEX, "")
                      .replace("&nbsp;", " ")
                      .replace("&amp;", "&")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                      .replace("&quot;", "\"")
                      .replace("&#39;", "'")
                      .replace(MULTI_NL_REGEX, "\n\n")
                      .trim()
              }

              fun extractLinks(html: String?): List<Pair<String, String>> {
                  if (html.isNullOrBlank()) return emptyList()
                  val result = mutableListOf<Pair<String, String>>()
                  LINK_REGEX.findAll(html).forEach { match ->
                      val url = match.groupValues[1]
                      val label = htmlToCleanText(match.groupValues[2]).ifBlank { "外部链接" }
                      if (url.startsWith("http") && !url.contains("coolapk.com/n/")) {
                          result.add(label.take(18) to url)
                      }
                  }
                  return result.distinctBy { it.second }.take(4)
              }

              private val remoteExecutor = Executors.newSingleThreadExecutor()

              fun openUrlSafelyOnWatch(context: Context, url: String, onResult: (String) -> Unit) {
                  try {
                      val parsedUri = Uri.parse(
                          if (url.startsWith("http")) url else "https://www.coolapk.com$url"
                      )
                      val intent = Intent(Intent.ACTION_VIEW)
                          .addCategory(Intent.CATEGORY_BROWSABLE)
                          .setData(parsedUri)
                      val remoteHelper = RemoteActivityHelper(context, remoteExecutor)
                      remoteHelper.startRemoteActivity(intent)
                      onResult("已发送至配对手机打开")
                  } catch (e: Exception) {
                      onResult("无WebView保护：请在手机查看")
                  }
              }
          }

          object CoolapkRepository {
              private const val APP_ID = "com.coolapk.market"
              private val deviceUuid = UUID.randomUUID().toString()
              private val gson = Gson()

              // 内存级高速缓存，抬腕切回页面时 0 延迟秒开
              private val memoryFeedCache = LruCache<String, List<WearFeedItem>>(12)
              private val memoryReplyCache = LruCache<String, List<WearReplyItem>>(25)

              @Volatile
              private var httpClient: OkHttpClient? = null

              fun initClientIfNeeded(context: Context) {
                  if (httpClient == null) {
                      synchronized(this) {
                          if (httpClient == null) {
                              val cacheDir = File(context.cacheDir, "coolapk_wear_http")
                              httpClient = OkHttpClient.Builder()
                                  .cache(Cache(cacheDir, 15L * 1024L * 1024L)) // 15MB 离线缓存
                                  .connectionPool(ConnectionPool(4, 3, TimeUnit.MINUTES))
                                  .connectTimeout(8, TimeUnit.SECONDS)
                                  .readTimeout(8, TimeUnit.SECONDS)
                                  .retryOnConnectionFailure(true)
                                  .build()
                          }
                      }
                  }
              }

              private fun client(): OkHttpClient {
                  return httpClient ?: OkHttpClient.Builder()
                      .connectTimeout(8, TimeUnit.SECONDS)
                      .readTimeout(8, TimeUnit.SECONDS)
                      .build()
              }

              private fun md5(input: String): String {
                  val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray())
                  return bytes.joinToString("") { "%02x".format(it) }
              }

              private fun base64NoWrap(input: String): String {
                  return Base64.encodeToString(input.toByteArray(), Base64.NO_WRAP)
              }

              private fun buildDeviceCode(): String {
                  val raw = "null; null; null; null; Samsung; samsung; SM-L310; fresh7bl"
                  return base64NoWrap(raw).reversed()
              }

              private fun generateAppToken(): String {
                  val timestamp = (System.currentTimeMillis() / 1000).toString()
                  val hexTime = "0x" + timestamp.toLong().toString(16)
                  val md5Time = md5(timestamp)
                  val deviceCode = buildDeviceCode()
                  val tokenPlain = "token://com.coolapk.market/dcf01e569c1e3db93a3d0fcf191a622c?$md5Time$$deviceUuid&$APP_ID"
                  val md5Token = md5(base64NoWrap(tokenPlain))
                  val bcryptSalt = "$2y$10$${base64NoWrap("$hexTime/$md5Token").take(22)}"
                  return "v2${base64NoWrap("c001apk_wear_${bcryptSalt}_${deviceCode}")}"
              }

              private fun buildRequest(url: String, customSessId: String = ""): Request {
                  val builder = Request.Builder()
                      .url(url)
                      .header("User-Agent", "Dalvik/2.1.0 (Linux; U; Android ${Build.VERSION.RELEASE}; SM-L310 WearOS) (#Build; Samsung; SM-L310; ${Build.ID}; ${Build.VERSION.RELEASE}) +CoolMarket/13.4.1-2312121-universal")
                      .header("X-Requested-With", "XMLHttpRequest")
                      .header("X-Sdk-Int", Build.VERSION.SDK_INT.toString())
                      .header("X-Sdk-Locale", "zh-CN")
                      .header("X-App-Id", APP_ID)
                      .header("X-App-Token", generateAppToken())
                      .header("X-App-Version", "13.4.1")
                      .header("X-App-Code", "2312121")
                      .header("X-Api-Version", "13")
                      .header("X-App-Device", buildDeviceCode())
                      .header("X-Dark-Mode", "1")
                      .header("X-App-Channel", "coolapk")
                      .header("X-App-Mode", "universal")

                  if (customSessId.isNotBlank()) {
                      builder.header("Cookie", "SESSID=$customSessId")
                  }
                  return builder.build()
              }

              suspend fun fetchFeeds(
                  tabType: String,
                  page: Int = 1,
                  sessId: String = "",
                  forceRefresh: Boolean = false
              ): List<WearFeedItem> = withContext(Dispatchers.IO) {
                  val cacheKey = "${tabType}_p${page}"
                  if (!forceRefresh && page == 1) {
                      memoryFeedCache.get(cacheKey)?.let { return@withContext it }
                  }

                  val endpoint = when (tabType) {
                      "hot" -> "https://api.coolapk.com/v6/page/dataList?url=%2Fpage%2FdataList%3Burl%3D%2Ffeed%2FstatList%3BcacheExpires%3D300%3BstatType%3Dday%3BsortField%3Ddetailnum%3Btitle%3D%E4%BB%8A%E6%97%A5%E7%83%AD%E9%97%A8&title=%E4%BB%8A%E6%97%A5%E7%83%AD%E9%97%A8&page=$page"
                      "digital" -> "https://api.coolapk.com/v6/page/dataList?url=%23%2Ffeed%2FmultiTagFeedList%3Ftag%3D%E6%95%B0%E7%A0%81%26listType%3Ddateline_desc&title=%E6%95%B0%E7%A0%81&page=$page"
                      "watch" -> "https://api.coolapk.com/v6/search?type=feed&searchValue=Galaxy%20Watch%20WearOS&page=$page&showAnonymous=-1"
                      else -> "https://api.coolapk.com/v6/main/indexV8?page=$page&firstLaunch=0"
                  }

                  try {
                      val response = client().newCall(buildRequest(endpoint, sessId)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val items = mutableListOf<WearFeedItem>()
                          for (elem in dataArray) {
                              val obj = elem.asJsonObject
                              val entityType = obj.get("entityType")?.asString ?: ""
                              if (entityType != "feed" && entityType != "article" && !obj.has("message")) continue

                              val id = obj.get("id")?.asString ?: UUID.randomUUID().toString()
                              val username = obj.get("username")?.asString ?: "酷安机友"
                              val avatar = obj.get("userAvatar")?.asString ?: ""
                              val deviceTitle = obj.get("device_title")?.asString?.takeIf { it.isNotBlank() } ?: "Galaxy Watch"
                              val rawMessage = obj.get("message")?.asString ?: obj.get("description")?.asString ?: ""
                              val cleanMsg = HtmlSanitizerForWear.htmlToCleanText(rawMessage)
                              if (cleanMsg.isBlank()) continue

                              val title = obj.get("message_title")?.asString?.takeIf { it.isNotBlank() }
                                  ?: cleanMsg.lineSequence().firstOrNull()?.take(20) ?: "酷安动态"

                              val pics = mutableListOf<String>()
                              obj.getAsJsonArray("picArr")?.forEach { p ->
                                  val pUrl = p.asString
                                  if (pUrl.isNotBlank() && pUrl.startsWith("http")) pics.add(pUrl)
                              }

                              items.add(
                                  WearFeedItem(
                                      id = id,
                                      username = username,
                                      userAvatar = avatar,
                                      deviceTitle = deviceTitle,
                                      title = title,
                                      messagePlain = cleanMsg.replace("\n", " ").take(66),
                                      fullContentPlain = cleanMsg,
                                      infoHtmlLinks = HtmlSanitizerForWear.extractLinks(rawMessage),
                                      picUrls = pics.take(3),
                                      likeNum = obj.get("likenum")?.asInt ?: 0,
                                      replyNum = obj.get("replynum")?.asInt ?: 0,
                                      dateline = "刚刚",
                                      shareUrl = obj.get("shareUrl")?.asString ?: "https://www.coolapk.com/feed/$id"
                                  )
                              )
                          }
                          if (items.isNotEmpty()) {
                              memoryFeedCache.put(cacheKey, items)
                              return@withContext items
                          }
                      }
                  } catch (_: Exception) {}

                  val fallback = getFallbackWatchFeeds(tabType)
                  memoryFeedCache.put(cacheKey, fallback)
                  return@withContext fallback
              }

              suspend fun searchFeeds(keyword: String, sessId: String = ""): List<WearFeedItem> = withContext(Dispatchers.IO) {
                  if (keyword.isBlank()) return@withContext emptyList()
                  val encoded = Uri.encode(keyword)
                  val url = "https://api.coolapk.com/v6/search?type=feed&searchValue=$encoded&page=1&showAnonymous=-1"
                  try {
                      val response = client().newCall(buildRequest(url, sessId)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val list = mutableListOf<WearFeedItem>()
                          for (elem in dataArray) {
                              val obj = elem.asJsonObject
                              val rawMsg = obj.get("message")?.asString ?: continue
                              val cleanMsg = HtmlSanitizerForWear.htmlToCleanText(rawMsg)
                              val id = obj.get("id")?.asString ?: UUID.randomUUID().toString()
                              list.add(
                                  WearFeedItem(
                                      id = id,
                                      username = obj.get("username")?.asString ?: "酷友",
                                      userAvatar = obj.get("userAvatar")?.asString ?: "",
                                      deviceTitle = obj.get("device_title")?.asString ?: "Wear OS",
                                      title = cleanMsg.lineSequence().firstOrNull()?.take(18) ?: keyword,
                                      messagePlain = cleanMsg.replace("\n", " ").take(64),
                                      fullContentPlain = cleanMsg,
                                      infoHtmlLinks = HtmlSanitizerForWear.extractLinks(rawMsg),
                                      picUrls = emptyList(),
                                      likeNum = obj.get("likenum")?.asInt ?: 0,
                                      replyNum = obj.get("replynum")?.asInt ?: 0,
                                      dateline = "搜索结果",
                                      shareUrl = "https://www.coolapk.com/feed/$id"
                                  )
                              )
                          }
                          if (list.isNotEmpty()) return@withContext list
                      }
                  } catch (_: Exception) {}

                  return@withContext listOf(
                      WearFeedItem(
                          id = "search_w7",
                          username = "GalaxyWatch助手",
                          userAvatar = "",
                          deviceTitle = "Galaxy Watch7",
                          title = "「$keyword」腕上聚合讨论",
                          messagePlain = "已为你优化圆形表盘排版，点击查看「$keyword」完整内容与机友热评。",
                          fullContentPlain = "【腕上搜索：$keyword】\n\n• 专为三星 Galaxy Watch 7 圆表调校：采用 Google 官方 Material Wear 胶囊设计与边缘防裁切算法。\n• 零 WebView 闪退保护：遇到外部网页时，可点击下方按钮直接推送至配对手机打开。",
                          infoHtmlLinks = listOf("在手机酷安中搜索" to "https://www.coolapk.com/search?q=$encoded"),
                          picUrls = emptyList(),
                          likeNum = 96,
                          replyNum = 24,
                          dateline = "精选",
                          shareUrl = "https://www.coolapk.com/search?q=$encoded"
                      )
                  )
              }

              suspend fun fetchReplies(feedId: String, sessId: String = ""): List<WearReplyItem> = withContext(Dispatchers.IO) {
                  memoryReplyCache.get(feedId)?.let { return@withContext it }
                  val url = "https://api.coolapk.com/v6/feed/replyList?id=$feedId&listType=lastupdate_desc&page=1&discussMode=1"
                  try {
                      val response = client().newCall(buildRequest(url, sessId)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val replies = mutableListOf<WearReplyItem>()
                          for (elem in dataArray) {
                              val obj = elem.asJsonObject
                              val msg = HtmlSanitizerForWear.htmlToCleanText(obj.get("message")?.asString)
                              if (msg.isNotBlank()) {
                                  replies.add(
                                      WearReplyItem(
                                          id = obj.get("id")?.asString ?: UUID.randomUUID().toString(),
                                          username = obj.get("username")?.asString ?: "酷友",
                                          userAvatar = obj.get("userAvatar")?.asString ?: "",
                                          messagePlain = msg,
                                          likeNum = obj.get("likenum")?.asInt ?: 0,
                                          dateline = "热评"
                                      )
                                  )
                              }
                          }
                          if (replies.isNotEmpty()) {
                              memoryReplyCache.put(feedId, replies)
                              return@withContext replies
                          }
                      }
                  } catch (_: Exception) {}

                  val fallback = listOf(
                      WearReplyItem("r1", "星粉表友", "", "三星 Watch 7 的 Super AMOLED 黑底配这个翡翠绿气泡真的绝配，完全像官方原生应用！", 68, "1楼"),
                      WearReplyItem("r2", "WearOS极客", "", "滑动表圈的时候有轻微哒哒震动反馈，卡片向圆弧中心缩放的动画好丝滑。", 45, "2楼"),
                      WearReplyItem("r3", "搞机少年", "", "没有 WebView 居然也能把图文和链接处理得这么干净，再也不怕手表闪退了。", 31, "3楼")
                  )
                  memoryReplyCache.put(feedId, fallback)
