          /**
           * 专为 Galaxy Watch 7 触控表圈与旋转表冠定制的丝滑滚动 + 微震动反馈修饰符
           */
          @Composable
          fun Modifier.watch7RotaryWithHaptics(listState: ScalingLazyListState): Modifier {
              val focusRequester = remember { FocusRequester() }
              val coroutineScope = rememberCoroutineScope()
              val view = LocalView.current
              var accumulatedDelta by remember { mutableFloatStateOf(0f) }

              LaunchedEffect(Unit) {
                  focusRequester.requestFocus()
              }
              return this
                  .onRotaryScrollEvent { event ->
                      val delta = event.verticalScrollPixels
                      accumulatedDelta += abs(delta)
                      // 当表圈滑动超过一定阈值时触发清脆的系统微震动，还原真实机械表圈手感
                      if (accumulatedDelta > 48f) {
                          view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                          accumulatedDelta = 0f
                      }
                      coroutineScope.launch {
                          listState.scrollBy(delta)
                      }
                      true
                  }
                  .focusRequester(focusRequester)
                  .focusable()
          }

          /**
           * 根据 Galaxy Watch 7 (40mm / 44mm) 圆形屏幕宽度动态计算水平安全边距，防止圆弧切角
