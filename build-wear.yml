          @Composable
          fun rememberWatchHorizontalPadding(): Dp {
              val config = LocalConfiguration.current
              val screenWidth = config.screenWidthDp
              return remember(screenWidth) {
                  (screenWidth * 0.065f).dp.coerceAtLeast(12.dp)
              }
          }

