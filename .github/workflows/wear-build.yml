name: "⭐【点我下载Watch7防闪退版】Build Wear OS APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-watch7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库最新代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 21 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. 启用系统内置 Android SDK 环境
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 4. 拔除全部 android.webkit 闪退源并注入 Galaxy Watch 7 圆屏适配
        shell: python3 {0}
        run: |
          import os, re, textwrap

          def write_file(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          # ==============================================================================
          # 1. 彻底净化 AppContainer.kt：
          # 拔除 android.webkit.CookieManager、WebSettings、WebView 的所有直接调用！
          # 三星 Galaxy Watch 7 在类加载阶段只要碰到 android.webkit 包就会闪退，
          # 因此我们直接让 defaultUserAgent 返回安全 UA，让 syncWebCookies 空实现，
          # 让 WebViewTransport 直接抛出 IOException 从而自动回退到原版 OkHttp 通道！
          # ==============================================================================
          app_container_path = "app/src/main/kotlin/com/zailinn/c001apk/AppContainer.kt"
          if os.path.exists(app_container_path):
              with open(app_container_path, "r", encoding="utf-8") as f:
                  ac_code = f.read()

              # 移除所有 android.webkit 导入，避免类加载器在手表上触发 MissingWebViewPackageError
              ac_code = re.sub(r"import\s+android\.webkit\..*\n", "", ac_code)

              # 替换 defaultUserAgent 函数实现
              ac_code = re.sub(
                  r"private fun defaultUserAgent\(context: Context\): String =[\s\S]*?(?=\n\s*\}\n\})",
                  """private fun defaultUserAgent(context: Context): String =
                      "Mozilla/5.0 (Linux; Android 14; SM-L310) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                  """,
                  ac_code
              )

              # 替换 syncWebCookies 函数实现（不再调用 CookieManager.getInstance()）
              ac_code = re.sub(
                  r"private fun syncWebCookies\(rawCookie: String\?\)\s*\{[\s\S]*?\n\s*\}",
                  """private fun syncWebCookies(rawCookie: String?) {
                      // Wear OS 手表无 WebView，跳过系统 WebView Cookie 同步，直接使用原版 AccountManager 存储的 Cookie
                  }""",
                  ac_code
              )

              # 替换 WebViewTransport 类（不再初始化 WebView，直接安全交由 OkHttp 处理）
              if "private class WebViewTransport(" in ac_code:
                  ac_code = re.sub(
                      r"private class WebViewTransport\([\s\S]*",
                      """private class WebViewTransport(
                          private val context: Context,
                          private val userAgentProvider: () -> String,
                      ) : HttpTransport {
                          override suspend fun execute(request: TransportRequest): TransportResponse {
                              throw java.io.IOException("Wear OS 手表无 WebView，已安全保护")
                          }
                      }
                      """,
                      ac_code
                  )

              with open(app_container_path, "w", encoding="utf-8") as f:
                  f.write(ac_code)
              print("1. AppContainer.kt 净化成功：已彻底移除所有 android.webkit 调用！")

          # ==============================================================================
          # 2. 彻底净化 WebScreen.kt：
          # 零 android.webkit 依赖，保留 WebScreen 与 syncCookiesFromWebView 签名供其它模块调用
          # ==============================================================================
          write_file("app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/WebScreen.kt", """
          package com.zailinn.c001apk.ui.screens.web

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.Toast
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.outlined.ArrowBack
          import androidx.compose.material.icons.outlined.ContentCopy
          import androidx.compose.material.icons.outlined.OpenInBrowser
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.zailinn.c001apk.ui.nav.LocalNavigator

          @Composable
          fun WebScreen(
              url: String,
              title: String = "",
              onCookieObtained: ((String) -> Unit)? = null,
          ) {
              val navigator = LocalNavigator.current
              val context = LocalContext.current
              val scrollState = rememberScrollState()

              Surface(
                  modifier = Modifier.fillMaxSize(),
                  color = Color.Black,
                  contentColor = Color.White
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(scrollState)
                          .padding(horizontal = 16.dp, vertical = 18.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.Center,
                          modifier = Modifier
                              .clip(CircleShape)
                              .background(Color(0xFF161922))
                              .border(1.dp, Color(0xFF34D399).copy(alpha = 0.45f), CircleShape)
                              .padding(horizontal = 10.dp, vertical = 4.dp)
                      ) {
                          IconButton(
                              onClick = { navigator.pop() },
                              modifier = Modifier.size(22.dp)
                          ) {
                              Icon(
                                  imageVector = Icons.AutoMirrored.Outlined.ArrowBack,
                                  contentDescription = "返回",
                                  tint = Color(0xFF34D399),
                                  modifier = Modifier.size(15.dp)
                              )
                          }
                          Spacer(modifier = Modifier.width(4.dp))
                          Text(
                              text = title.ifBlank { "腕上安全网页" },
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color(0xFF34D399),
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }

                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(18.dp))
                              .background(Color(0xFF161922))
                              .border(1.dp, Color(0xFF2A3042), RoundedCornerShape(18.dp))
                              .padding(12.dp)
                      ) {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.spacedBy(4.dp)
                          ) {
                              Text(
                                  text = "Galaxy Watch 7 无 WebView 保护",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color(0xFF38BDF8),
                                  textAlign = TextAlign.Center
                              )
                              Text(
                                  text = if (onCookieObtained != null) {
                                      "手表系统不支持网页端扫码/账密组件。请返回上一页使用原版「导入 Cookie」功能登录，或直接使用游客模式！"
                                  } else {
                                      url
                                  },
                                  fontSize = 11.sp,
                                  color = Color(0xFFCBD5E1),
                                  maxLines = 4,
                                  overflow = TextOverflow.Ellipsis,
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      Button(
                          onClick = {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  context.startActivity(intent)
                              } catch (_: Throwable) {
                                  copyToClipboardSafe(context, url)
                                  Toast.makeText(context, "已复制链接", Toast.LENGTH_SHORT).show()
                              }
                          },
                          shape = CircleShape,
                          colors = ButtonDefaults.buttonColors(
                              containerColor = Color(0xFF34D399),
                              contentColor = Color.Black
                          ),
                          modifier = Modifier.fillMaxWidth().height(36.dp)
                      ) {
                          Icon(Icons.Outlined.OpenInBrowser, contentDescription = null, modifier = Modifier.size(15.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("调用外部浏览器", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      OutlinedButton(
                          onClick = {
                              copyToClipboardSafe(context, url)
                              Toast.makeText(context, "已复制链接到剪贴板", Toast.LENGTH_SHORT).show()
                          },
                          shape = CircleShape,
                          modifier = Modifier.fillMaxWidth().height(34.dp)
                      ) {
                          Icon(Icons.Outlined.ContentCopy, contentDescription = null, modifier = Modifier.size(14.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text("复制链接", fontSize = 11.sp)
                      }
                  }
              }
          }

          private fun copyToClipboardSafe(context: Context, text: String) {
              try {
                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                  cm?.setPrimaryClip(ClipData.newPlainText("url", text))
              } catch (_: Throwable) {}
          }

          internal fun syncCookiesFromWebView(onCookieObtained: ((String) -> Unit)?) {
              // Wear OS 无 WebView，安全空实现
          }
          """)

          # ==============================================================================
          # 3. 彻底净化 CaptchaDialog.kt：零 android.webkit 依赖
          # ==============================================================================
          write_file("app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/CaptchaDialog.kt", """
          package com.zailinn.c001apk.ui.screens.web

          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.zailinn.c001apk.core.net.CaptchaChallenge
          import com.zailinn.c001apk.core.net.CaptchaEvent

          @Composable
          fun CaptchaDialog(
              challenge: CaptchaChallenge,
              userAgent: String,
              onCookieObtained: ((String) -> Unit)? = null,
              onEvent: ((CaptchaEvent) -> Unit)? = null,
              onSolved: () -> Unit,
              onDismiss: () -> Unit,
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  shape = RoundedCornerShape(22.dp),
                  title = {
                      Text("腕上安全验证保护", fontSize = 14.sp, fontWeight = FontWeight.Bold)
                  },
                  text = {
                      Text(
                          "由于 Wear OS 手表系统无 WebView 组件，已自动拦截网页验证码弹窗以防止闪退。建议在「我的」页面使用 Cookie 导入登录，或直接点击重试。",
                          fontSize = 12.sp
                      )
                  },
                  confirmButton = {
                      TextButton(onClick = onSolved) {
                          Text("重试请求")
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("取消")
                      }
                  }
              )
          }
          """)
          print("2. WebScreen.kt 与 CaptchaDialog.kt 净化成功！")

          # ==============================================================================
          # 4. 注入 Galaxy Watch 7 圆表专属 MainActivity.kt（修正全部 sp 语法，移除 enableEdgeToEdge）
          # ==============================================================================
          write_file("app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt", """
          package com.zailinn.c001apk

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.compose.setContent
          import androidx.appcompat.app.AppCompatActivity
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Button
          import androidx.compose.material3.ButtonDefaults
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.Density
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.zailinn.c001apk.ui.App
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlinx.coroutines.delay

          class MainActivity : AppCompatActivity() {
              lateinit var container: AppContainer
                  private set

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  var startupError: Throwable? = null
                  try {
                      container = AppContainer(applicationContext)
                  } catch (t: Throwable) {
                      startupError = t
                  }

                  setContent {
                      var currentError by remember { mutableStateOf(startupError) }

                      if (currentError != null || !::container.isInitialized) {
                          WatchSafeRecoveryScreen(
                              error = currentError,
                              onRetry = {
                                  try {
                                      container = AppContainer(applicationContext)
                                      currentError = null
                                  } catch (e: Throwable) {
                                      currentError = e
                                  }
                              }
                          )
                      } else {
                          GalaxyWatch7RoundAdapter {
                              App(container)
                          }
                      }
                  }
              }
          }

          @Composable
          fun WatchSafeRecoveryScreen(
              error: Throwable?,
              onRetry: () -> Unit
          ) {
              val scrollState = rememberScrollState()
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .padding(24.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      modifier = Modifier.verticalScroll(scrollState),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Text(
                          text = "Watch 7 安全诊断模式",
                          color = Color(0xFF34D399),
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Text(
                          text = error?.let { "${it.javaClass.simpleName}: ${it.message}" } ?: "正在初始化组件...",
                          color = Color(0xFFF87171),
                          fontSize = 10.sp,
                          textAlign = TextAlign.Center
                      )
                      Button(
                          onClick = onRetry,
                          shape = CircleShape,
                          colors = ButtonDefaults.buttonColors(
                              containerColor = Color(0xFF34D399),
                              contentColor = Color.Black
                          )
                      ) {
                          Text("点击重试启动", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }

          @Composable
          fun GalaxyWatch7RoundAdapter(content: @Composable () -> Unit) {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("watch7_ui_adapter", Context.MODE_PRIVATE) }

              var insetMode by remember { mutableIntStateOf(prefs.getInt("inset_mode", 0)) }
              var scaleTier by remember { mutableIntStateOf(prefs.getInt("scale_tier", 0)) }

              val config = LocalConfiguration.current
              val screenMinDp = minOf(config.screenWidthDp, config.screenHeightDp)

              val horizPad = when (insetMode) {
                  0 -> (screenMinDp * 0.085f).dp
                  1 -> (screenMinDp * 0.035f).dp
                  else -> 0.dp
              }
              val topPad = when (insetMode) {
                  0 -> 24.dp
                  1 -> 20.dp
                  else -> 16.dp
              }
              val bottomPad = when (insetMode) {
                  0 -> (screenMinDp * 0.085f).dp
                  1 -> (screenMinDp * 0.04f).dp
                  else -> 0.dp
              }

              val densityMultiplier = when (scaleTier) {
                  0 -> 0.76f
                  1 -> 0.88f
                  else -> 1.0f
              }

              var timeStr by remember { mutableStateOf("") }
              LaunchedEffect(Unit) {
                  val sdf = SimpleDateFormat("HH:mm", Locale.getDefault())
                  while (true) {
                      timeStr = sdf.format(Date())
                      delay(10_000L)
                  }
              }

              val baseDensity = LocalDensity.current
              val adaptedDensity = remember(baseDensity, densityMultiplier, scaleTier) {
                  Density(
                      density = baseDensity.density * densityMultiplier,
                      fontScale = baseDensity.fontScale * (if (scaleTier == 2) 1.10f else 0.98f)
                  )
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black),
                  contentAlignment = Alignment.Center
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(
                              start = horizPad,
                              end = horizPad,
                              top = topPad,
                              bottom = bottomPad
                          )
                          .clip(RoundedCornerShape(if (insetMode == 0) 24.dp else 12.dp))
                          .border(
                              width = if (insetMode == 0) 1.dp else 0.dp,
                              color = if (insetMode == 0) Color(0xFF222836) else Color.Transparent,
                              shape = RoundedCornerShape(if (insetMode == 0) 24.dp else 12.dp)
                          )
                  ) {
                      CompositionLocalProvider(LocalDensity provides adaptedDensity) {
                          content()
                      }
                  }

                  Row(
                      modifier = Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 2.dp)
                          .clip(CircleShape)
                          .background(Color(0xFF141821).copy(alpha = 0.94f))
                          .border(1.dp, Color(0xFF34D399).copy(alpha = 0.45f), CircleShape)
                          .padding(horizontal = 10.dp, vertical = 2.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Text(
                          text = timeStr,
                          color = Color(0xFFF8FAFC),
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Text(
                          text = when (insetMode) {
                              0 -> "圆表防裁"
                              1 -> "微缩"
                              else -> "满屏"
                          },
                          color = Color(0xFF34D399),
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.clickable {
                              insetMode = (insetMode + 1) % 3
                              prefs.edit().putInt("inset_mode", insetMode).apply()
                          }
                      )

                      Text(
                          text = when (scaleTier) {
                              0 -> "手表比例"
                              1 -> "中号"
                              else -> "大字"
                          },
                          color = Color(0xFF38BDF8),
                          fontSize = 10.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.clickable {
                              scaleTier = (scaleTier + 1) % 3
                              prefs.edit().putInt("scale_tier", scaleTier).apply()
                          }
                      )
                  }
              }
          }
          """)
          print("3. MainActivity.kt 圆表安全舱注入成功！")

      - name: 5. 编译最新版 Galaxy Watch 7 专属 APK (带详细日志输出)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -x test -x lint --no-daemon --stacktrace
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/app-debug.apk output_apks/c001apk-GalaxyWatch7-NoCrash.apk
          ls -lh output_apks/

      - name: 6. 上传可直接安装到三星 Galaxy Watch 7 的最终版 APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch7-NoCrash-APK
          path: output_apks/*.apk
          if-no-files-found: error