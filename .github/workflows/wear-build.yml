          print("全部 Wear OS 防闪退补丁与 Galaxy Watch 7 圆表适配注入完成！")

      - name: 5. 编译最新版 Galaxy Watch 7 专属 APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/c001apk-GalaxyWatch7-Ultimate.apk \;
