name: "⭐【Watch7终极修复版】Build Wear OS APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-watch7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库最新代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 21 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. 启用系统内置 Android SDK 环境
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 4. 注入防闪退子类垫片与 Galaxy Watch 7 圆表适配层
        run: |
          echo "=== Step 4.1: 替换全局 WebSettings / CookieManager / WebStorage 静态调用 ==="
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i \
            -e 's/WebSettings\.getDefaultUserAgent(/com.zailinn.c001apk.WearSafeWebkit.getDefaultUserAgent(/g' \
            -e 's/CookieManager\.getInstance()/com.zailinn.c001apk.WearSafeCookieManager.getInstance()/g' \
            -e 's/WebStorage\.getInstance()/com.zailinn.c001apk.WearSafeWebStorage.getInstance()/g' \
            {} +

          echo "=== Step 4.2: 拦截 AppContainer 中的后台 WebView 实例创建 ==="
          sed -i 's/\bWebView(/com.zailinn.c001apk.WearSafeWebkit.createWebViewOrThrow(/g' \
            app/src/main/kotlin/com/zailinn/c001apk/AppContainer.kt

          echo "=== Step 4.3: 接管 WebScreen 与 CaptchaDialog 中的 AndroidView 渲染 ==="
          sed -i 's/import androidx\.compose\.ui\.viewinterop\.AndroidView/import com.zailinn.c001apk.WearSafeAndroidView as AndroidView/g' \
            app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/WebScreen.kt \
            app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/CaptchaDialog.kt

          echo "=== Step 4.4: 接管 MainActivity 的 setContent 与 enableEdgeToEdge ==="
          sed -i 's/enableEdgeToEdge()/wearSafeEnableEdgeToEdge()/g' \
            app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt
          sed -i 's/setContent/wearSafeSetContent/g' \
            app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt
          sed -i 's/import androidx\.activity\.compose\.wearSafeSetContent/import androidx.activity.compose.setContent/g' \
            app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt

          echo "=== Step 4.5: 生成 WearSafeShim.kt 核心适配与防闪退文件 ==="
          cat << 'END_SHIM' > app/src/main/kotlin/com/zailinn/c001apk/WearSafeShim.kt
          package com.zailinn.c001apk

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Looper
          import android.util.Log
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.ValueCallback
          import android.webkit.WebSettings
          import android.webkit.WebStorage
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.LocalOnBackPressedDispatcherOwner
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.unit.Density
          import androidx.compose.ui.unit.dp
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.min
          import kotlinx.coroutines.delay

          fun ComponentActivity.wearSafeEnableEdgeToEdge() {
              WearSafeWebkit.installCrashShield()
          }

          fun ComponentActivity.wearSafeSetContent(
              content: @Composable () -> Unit
          ) {
              WearSafeWebkit.installCrashShield()
              setContent {
                  WearSafeWebkit.Watch7AdaptiveContainer {
                      content()
                  }
              }
          }

          @Composable
          fun <T : View> WearSafeAndroidView(
              factory: (Context) -> T,
              modifier: Modifier = Modifier,
              update: (T) -> Unit = {}
          ) {
              if (WearSafeWebkit.isNoWebView()) {
                  WearSafeWebkit.NoWebViewFallbackScreen(modifier)
              } else {
                  androidx.compose.ui.viewinterop.AndroidView(
                      factory = factory,
                      modifier = modifier,
                      update = update
                  )
              }
          }

          object WearSafeWebkit {
              @Volatile
              private var guardInstalled = false

              fun installCrashShield() {
                  if (guardInstalled) return
                  guardInstalled = true
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      Log.e("WearSafeWebkit", "Intercepted crash on " + thread.name, throwable)
                      if (thread == Looper.getMainLooper().thread) {
                          while (true) {
                              try {
                                  Looper.loop()
                              } catch (t: Throwable) {
                                  Log.e("WearSafeWebkit", "Recovered main looper crash", t)
                              }
                          }
                      } else {
                          try {
                              defaultHandler?.uncaughtException(thread, throwable)
                          } catch (_: Throwable) {}
                      }
                  }
              }

              fun isNoWebView(): Boolean {
                  return try {
                      val pkg = WebView.getCurrentWebViewPackage()
                      if (pkg == null) return true
                      android.webkit.CookieManager.getInstance()
                      false
                  } catch (_: Throwable) {
                      true
                  }
              }

              fun createWebViewOrThrow(context: Context): WebView {
                  installCrashShield()
                  if (isNoWebView()) {
                      throw IOException("Wear OS has no WebView")
                  }
                  return WebView(context)
              }

              fun getDefaultUserAgent(context: Context): String {
                  installCrashShield()
                  return try {
                      if (isNoWebView()) {
                          "Mozilla/5.0 (Linux; Android 14; SM-L310) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                      } else {
                          WebSettings.getDefaultUserAgent(context)
                      }
                  } catch (_: Throwable) {
                      "Mozilla/5.0 (Linux; Android 14; SM-L310) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
                  }
              }

              @Composable
              fun NoWebViewFallbackScreen(modifier: Modifier = Modifier) {
                  val context = LocalContext.current
                  val backDispatcher = LocalOnBackPressedDispatcherOwner.current?.onBackPressedDispatcher
                  Surface(
                      modifier = modifier.fillMaxSize(),
                      color = Color.Black,
                      contentColor = Color.White
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(16.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(8.dp, Alignment.CenterVertically)
                      ) {
                          Text(
                              text = "腕上免 WebView 保护",
                              style = MaterialTheme.typography.titleMedium,
                              color = Color(0xFF34D399)
                          )
                          Text(
                              text = "三星 Galaxy Watch 7 无内置 WebView。登录请返回使用原版「Cookie 导入」，或直接以游客模式浏览全部内容与图片！",
                              style = MaterialTheme.typography.bodySmall,
                              color = Color(0xFFCBD5E1)
                          )
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedButton(onClick = { backDispatcher?.onBackPressed() }) {
                                  Text("返回")
                              }
                              Button(
                                  onClick = {
                                      try {
                                          val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.coolapk.com")).apply {
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                          }
                                          context.startActivity(intent)
                                      } catch (_: Throwable) {
                                          Toast.makeText(context, "已拦截网页闪退，请点返回继续使用", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              ) {
                                  Text("外部打开")
                              }
                          }
                      }
                  }
              }

              @Composable
              fun Watch7AdaptiveContainer(content: @Composable () -> Unit) {
                  installCrashShield()
                  val context = LocalContext.current
                  val prefs = remember {
                      context.getSharedPreferences("watch7_ui_prefs", Context.MODE_PRIVATE)
                  }

                  val insetModeState = remember { mutableStateOf(prefs.getInt("inset_mode", 0)) }
                  val scaleModeState = remember { mutableStateOf(prefs.getInt("scale_mode", 0)) }
                  val pillExpandedState = remember { mutableStateOf(true) }

                  val insetMode = insetModeState.value
                  val scaleMode = scaleModeState.value
                  val pillExpanded = pillExpandedState.value

                  val config = LocalConfiguration.current
                  val minDp = min(config.screenWidthDp, config.screenHeightDp)

                  val sidePad = when (insetMode) {
                      0 -> (minDp * 0.095f).dp
                      1 -> (minDp * 0.045f).dp
                      else -> 0.dp
                  }
                  val topPad = when (insetMode) {
                      0 -> (minDp * 0.115f).dp
                      1 -> (minDp * 0.08f).dp
                      else -> 16.dp
                  }
                  val bottomPad = when (insetMode) {
                      0 -> (minDp * 0.095f).dp
                      1 -> (minDp * 0.045f).dp
                      else -> 0.dp
                  }

                  val densityFactor = when (scaleMode) {
                      0 -> 0.66f
                      1 -> 0.78f
                      else -> 0.90f
                  }

                  val timeTextState = remember { mutableStateOf("") }
                  LaunchedEffect(Unit) {
                      val sdf = SimpleDateFormat("HH:mm", Locale.getDefault())
                      while (true) {
                          timeTextState.value = sdf.format(Date())
                          delay(10000L)
                      }
                  }

                  val origDensity = LocalDensity.current
                  val watchDensity = remember(origDensity, densityFactor, scaleMode) {
                      Density(
                          density = origDensity.density * densityFactor,
                          fontScale = origDensity.fontScale * (if (scaleMode == 2) 1.08f else 0.96f)
                      )
                  }

                  val cornerDp = when (insetMode) {
                      0 -> 28.dp
                      1 -> 16.dp
                      else -> 0.dp
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(
                                  start = sidePad,
                                  end = sidePad,
                                  top = topPad,
                                  bottom = bottomPad
                              )
                              .clip(RoundedCornerShape(cornerDp))
                              .border(
                                  width = if (insetMode == 2) 0.dp else 1.dp,
                                  color = Color(0xFF1E293B),
                                  shape = RoundedCornerShape(cornerDp)
                              )
                      ) {
                          CompositionLocalProvider(LocalDensity provides watchDensity) {
                              content()
                          }
                      }

                      Row(
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .padding(top = 2.dp)
                              .clip(CircleShape)
                              .background(Color(0xFF0F172A))
                              .border(1.dp, Color(0xFF34D399).copy(alpha = 0.5f), CircleShape)
                              .padding(horizontal = 8.dp, vertical = 2.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Text(
                              text = timeTextState.value,
                              color = Color.White,
                              style = MaterialTheme.typography.labelSmall,
                              modifier = Modifier.clickable {
                                  pillExpandedState.value = !pillExpanded
                              }
                          )
                          if (pillExpanded) {
                              Text(
                                  text = when (insetMode) {
                                      0 -> "◎圆屏"
                                      1 -> "◯扩屏"
                                      else -> "□满屏"
                                  },
                                  color = Color(0xFF34D399),
                                  style = MaterialTheme.typography.labelSmall,
                                  modifier = Modifier.clickable {
                                      val next = (insetMode + 1) % 3
                                      insetModeState.value = next
                                      prefs.edit().putInt("inset_mode", next).apply()
                                  }
                              )
                              Text(
                                  text = when (scaleMode) {
                                      0 -> "Aa小"
                                      1 -> "Aa中"
                                      else -> "Aa大"
                                  },
                                  color = Color(0xFF38BDF8),
                                  style = MaterialTheme.typography.labelSmall,
                                  modifier = Modifier.clickable {
                                      val next = (scaleMode + 1) % 3
                                      scaleModeState.value = next
                                      prefs.edit().putInt("scale_mode", next).apply()
                                  }
                              )
                          }
                      }
                  }
              }
          }

          class WearSafeCookieManager : CookieManager() {
              companion object {
                  private val fallbackInstance by lazy { WearSafeCookieManager() }

                  fun getInstance(): CookieManager {
                      WearSafeWebkit.installCrashShield()
                      return try {
                          if (WearSafeWebkit.isNoWebView()) {
                              fallbackInstance
                          } else {
                              android.webkit.CookieManager.getInstance()
                          }
                      } catch (_: Throwable) {
                          fallbackInstance
                      }
                  }
              }

              override fun setAcceptCookie(accept: Boolean) {}
              override fun acceptCookie(): Boolean = false
              override fun setAcceptThirdPartyCookies(webview: WebView?, accept: Boolean) {}
              override fun acceptThirdPartyCookies(webview: WebView?): Boolean = false
              override fun setCookie(url: String?, value: String?) {}
              override fun setCookie(url: String?, value: String?, callback: ValueCallback<Boolean>?) {
                  try { callback?.onReceiveValue(false) } catch (_: Throwable) {}
              }
              override fun getCookie(url: String?): String? = null
              override fun removeSessionCookie() {}
              override fun removeSessionCookies(callback: ValueCallback<Boolean>?) {
                  try { callback?.onReceiveValue(false) } catch (_: Throwable) {}
              }
              override fun removeAllCookie() {}
              override fun removeAllCookies(callback: ValueCallback<Boolean>?) {
                  try { callback?.onReceiveValue(false) } catch (_: Throwable) {}
              }
              override fun hasCookies(): Boolean = false
              override fun removeExpiredCookie() {}
              override fun flush() {}
              override fun allowFileSchemeCookiesImpl(): Boolean = false
              override fun setAcceptFileSchemeCookiesImpl(accept: Boolean) {}
          }

          object WearSafeWebStorage {
              fun getInstance(): WearSafeWebStorage = this

              fun deleteAllData() {
                  try {
                      if (!WearSafeWebkit.isNoWebView()) {
                          WebStorage.getInstance().deleteAllData()
                      }
                  } catch (_: Throwable) {}
              }
          }
          END_SHIM

      - name: 5. 编译最新版 Galaxy Watch 7 专属 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -x test -x lint --no-daemon --stacktrace
          mkdir -p output_apks
          cp app/build/outputs/apk/debug/app-debug.apk output_apks/c001apk-GalaxyWatch7-Final.apk
          ls -lh output_apks/

      - name: 6. 上传可直接安装到三星 Galaxy Watch 7 的最终版 APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch7-Final-APK
          path: output_apks/*.apk
          if-no-files-found: error