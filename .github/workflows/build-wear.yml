          @Composable
          fun WatchAccountAndSettingsScreen(
              fontScale: Float,
              rawCookie: String,
              onFontScaleChange: (Float) -> Unit,
              onCookieChange: (String) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 0)
              val horizontalPad = rememberWatchHorizontalPadding()
              val view = LocalView.current
              var inputCookie by remember { mutableStateOf(rawCookie) }
              var profile by remember {
                  mutableStateOf(
                      WearUserProfile("guest", "正在读取状态...", "", "", 0, 0, 0, 0, false)
                  )
              }

              LaunchedEffect(rawCookie) {
                  profile = CoolapkRepository.checkUserProfile(rawCookie)
              }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 0),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "profile_card") {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(WatchSurfaceElevated)
                                  .border(1.dp, WatchPrimaryGreen.copy(alpha = 0.35f), RoundedCornerShape(22.dp))
                                  .padding(12.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              UserAvatarBadge(
                                  avatarUrl = profile.userAvatar,
                                  username = profile.username,
                                  accentColor = if (profile.isLoggedIn) WatchPrimaryGreen else WatchSkyBlue,
                                  size = 34.dp
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = profile.username,
                                  color = WatchTextPrimary,
                                  fontSize = (13 * fontScale).sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(modifier = Modifier.height(3.dp))
                              Text(
                                  text = profile.bio,
                                  color = WatchTextSecondary,
                                  fontSize = (10.5f * fontScale).sp,
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      item(key = "cookie_input") {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, WatchBorderSubtle, RoundedCornerShape(20.dp))
                                  .padding(12.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  text = "原版 Cookie 登录 (支持完整Cookie或SESSID)",
                                  color = WatchPrimaryGreen,
                                  fontSize = (10.5f * fontScale).sp,
                                  fontWeight = FontWeight.SemiBold,
                                  textAlign = TextAlign.Center
                              )
                              Spacer(modifier = Modifier.height(6.dp))
                              BasicTextField(
                                  value = inputCookie,
                                  onValueChange = {
                                      inputCookie = it
                                      onCookieChange(it)
                                  },
                                  singleLine = true,
                                  textStyle = TextStyle(
                                      color = WatchTextPrimary,
                                      fontSize = (11.5f * fontScale).sp,
                                      textAlign = TextAlign.Center
                                  ),
                                  cursorBrush = SolidColor(WatchPrimaryGreen),
                                  decorationBox = { inner ->
                                      if (inputCookie.isEmpty()) {
                                          Text(
                                              text = "点此粘贴 Cookie，留空即为游客模式",
                                              color = Color(0xFF64748B),
                                              fontSize = (11 * fontScale).sp,
                                              textAlign = TextAlign.Center
                                          )
                                      }
                                      inner()
                                  }
                              )
                              if (inputCookie.isNotBlank()) {
                                  Spacer(modifier = Modifier.height(6.dp))
                                  CompactChip(
                                      onClick = {
                                          view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                          inputCookie = ""
                                          onCookieChange("")
                                      },
                                      label = { Text("切回游客模式", fontSize = 10.5f.sp) },
                                      colors = ChipDefaults.secondaryChipColors(
                                          backgroundColor = Color(0xFF3B122B),
                                          contentColor = WatchPink
                                      )
                                  )
                              }
                          }
                      }

                      item(key = "font_scale_chip") {
                          val scaleLabel = when {
                              fontScale >= 1.2f -> "超大清晰字号 (125%)"
                              fontScale >= 1.1f -> "舒适大字号 (115%)"
                              else -> "圆表标准字号 (100%)"
                          }
                          Chip(
                              modifier = Modifier.fillMaxWidth(),
                              onClick = {
                                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  val next = when {
                                      fontScale < 1.1f -> 1.15f
                                      fontScale < 1.2f -> 1.25f
                                      else -> 1.0f
                                  }
                                  onFontScaleChange(next)
                              },
                              shape = CircleShape,
                              colors = ChipDefaults.secondaryChipColors(
                                  backgroundColor = WatchSurfaceElevated
                              ),
                              icon = {
                                  Icon(
                                      imageVector = Icons.Default.Settings,
                                      contentDescription = null,
                                      tint = WatchPrimaryGreen
                                  )
                              },
                              label = { Text("字体缩放比例", fontSize = (13 * fontScale).sp) },
                              secondaryLabel = { Text(scaleLabel, color = WatchPrimaryGreen, fontSize = (11 * fontScale).sp) }
                          )
                      }
                  }
              }
          }
          EOF

      - name: 5. 编译三星 Galaxy Watch 7 腕上专属版 APK
        run: |
          mkdir -p output_apks
          cd wear_standalone
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          find wear_standalone/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/c001apk-GalaxyWatch7-WearOS.apk \;
          ls -lh output_apks/

      - name: 6. 上传编译好的 APK 安装包 (含 Watch 7 腕上版)
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-GalaxyWatch7-APK
          path: output_apks/*.apk
          if-no-files-found: error