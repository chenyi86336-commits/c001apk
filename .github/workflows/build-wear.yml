          @Composable
          fun WatchFeedListScreen(
              tabType: String,
              rawCookie: String,
              fontScale: Float,
              onFeedClick: (WearFeedItem) -> Unit,
              onImageClick: (List<String>, Int) -> Unit
          ) {
              val listState = rememberScalingLazyListState(initialCenterItemIndex = 1)
              val horizontalPad = rememberWatchHorizontalPadding()
              val coroutineScope = rememberCoroutineScope()
              val view = LocalView.current

              var feeds by remember { mutableStateOf<List<WearFeedItem>>(emptyList()) }
              var isLoading by remember { mutableStateOf(true) }
              var page by remember { mutableStateOf(1) }

              val (tabTitle, accentColor) = remember(tabType) {
                  when (tabType) {
                      "follow" -> "我的关注" to WatchPink
                      "hot" -> "今日热榜" to WatchWarmOrange
                      "watch" -> "圆表专区" to WatchSkyBlue
                      "digital" -> "数码广场" to WatchPurple
                      else -> "酷安头条" to WatchPrimaryGreen
                  }
              }

              fun loadData(targetPage: Int, force: Boolean = false) {
                  coroutineScope.launch {
                      isLoading = true
                      val result = CoolapkRepository.fetchFeeds(tabType, targetPage, rawCookie, force)
                      feeds = if (targetPage == 1) result else (feeds + result).distinctBy { it.id }
                      isLoading = false
                  }
              }

              LaunchedEffect(tabType, rawCookie) {
                  loadData(1, force = false)
              }

              WatchRoundScaffold(listState = listState) {
                  ScalingLazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black)
                          .watch7RotaryWithHaptics(listState),
                      state = listState,
                      autoCentering = AutoCenteringParams(itemIndex = 1),
                      scalingParams = ScalingLazyColumnDefaults.scalingParams(
                          edgeScale = 0.68f,
                          edgeAlpha = 0.45f
                      ),
                      contentPadding = PaddingValues(horizontal = horizontalPad, vertical = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      item(key = "list_header") {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center,
                              modifier = Modifier
                                  .clip(CircleShape)
                                  .background(WatchSurfaceCard)
                                  .border(1.dp, accentColor.copy(alpha = 0.35f), CircleShape)
                                  .clickable {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      page = 1
                                      loadData(1, force = true)
                                  }
                                  .padding(horizontal = 14.dp, vertical = 5.dp)
                          ) {
                              Text(
                                  text = tabTitle,
                                  color = accentColor,
                                  fontSize = (13 * fontScale).sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Spacer(modifier = Modifier.width(6.dp))
                              Icon(
                                  imageVector = Icons.Default.Refresh,
                                  contentDescription = "刷新",
                                  tint = accentColor,
                                  modifier = Modifier.size(14.dp)
                              )
                          }
                      }

                      if (isLoading && feeds.isEmpty()) {
                          item(key = "loading") {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 26.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  CircularProgressIndicator(
                                      indicatorColor = accentColor,
                                      trackColor = WatchSurfaceElevated,
                                      strokeWidth = 3.dp,
                                      modifier = Modifier.size(34.dp)
                                  )
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(
                                      text = "正在加载图文动态...",
                                      color = WatchTextSecondary,
                                      fontSize = 11.sp
                                  )
                              }
                          }
                      } else {
                          items(
                              items = feeds,
                              key = { it.id }
                          ) { item ->
                              GoogleWearFeedCard(
                                  item = item,
                                  accentColor = accentColor,
                                  fontScale = fontScale,
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      onFeedClick(item)
                                  },
                                  onImageClick = { idx ->
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      onImageClick(item.picUrls, idx)
                                  }
                              )
                          }

                          item(key = "load_more") {
                              CompactChip(
                                  onClick = {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      page += 1
                                      loadData(page, force = true)
                                  },
                                  label = {
                                      Text(
                                          text = if (isLoading) "加载中..." else "加载下一页",
                                          fontSize = (12 * fontScale).sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                  },
                                  icon = {
                                      Icon(
                                          imageVector = Icons.Default.KeyboardArrowDown,
                                          contentDescription = null,
                                          modifier = Modifier.size(16.dp)
                                      )
                                  },
                                  colors = ChipDefaults.primaryChipColors(
                                      backgroundColor = accentColor,
                                      contentColor = Color.Black
                                  )
                              )
                          }
                      }
                  }
              }
          }

