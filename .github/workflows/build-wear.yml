          @Composable
          fun WatchFullImageViewerScreen(
              imageUrls: List<String>,
              initialIndex: Int
          ) {
              val context = LocalContext.current
              val view = LocalView.current
              if (imageUrls.isEmpty()) return

              var currentIndex by remember { mutableStateOf(initialIndex.coerceIn(0, imageUrls.lastIndex)) }
              var scale by remember { mutableStateOf(1f) }
              var offset by remember { mutableStateOf(Offset.Zero) }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onDoubleTap = {
                                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  if (scale > 1.1f) {
                                      scale = 1f
                                      offset = Offset.Zero
                                  } else {
                                      scale = 2.2f
                                  }
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          detectTransformGestures { _, pan, zoom, _ ->
                              val newScale = (scale * zoom).coerceIn(1f, 4f)
                              scale = newScale
                              if (newScale > 1f) {
                                  offset += pan
                              } else {
                                  offset = Offset.Zero
                              }
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  AsyncImage(
                      model = ImageRequest.Builder(context)
                          .data(imageUrls[currentIndex])
                          .size(900)
                          .crossfade(true)
                          .build(),
                      contentDescription = "高清大图",
                      contentScale = ContentScale.Fit,
                      modifier = Modifier
                          .fillMaxSize()
                          .graphicsLayer(
                              scaleX = scale,
                              scaleY = scale,
                              translationX = offset.x,
                              translationY = offset.y
                          )
                  )

                  Row(
                      modifier = Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 14.dp)
                          .clip(CircleShape)
                          .background(Color.Black.copy(alpha = 0.65f))
                          .border(1.dp, WatchBorderSubtle, CircleShape)
                          .padding(horizontal = 10.dp, vertical = 3.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = "${currentIndex + 1} / ${imageUrls.size} · ${String.format("%.1fx", scale)}",
                          color = WatchPrimaryGreen,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold
                      )
                  }

                  Row(
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(bottom = 14.dp)
                          .clip(CircleShape)
                          .background(Color.Black.copy(alpha = 0.72f))
                          .border(1.dp, WatchBorderSubtle, CircleShape)
                          .padding(horizontal = 8.dp, vertical = 4.dp),
                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      if (imageUrls.size > 1) {
                          Icon(
                              imageVector = Icons.Default.KeyboardArrowLeft,
                              contentDescription = "上一张",
                              tint = if (currentIndex > 0) WatchTextPrimary else WatchTextSecondary,
                              modifier = Modifier
                                  .size(22.dp)
                                  .clickable(enabled = currentIndex > 0) {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      currentIndex -= 1
                                      scale = 1f
                                      offset = Offset.Zero
                                  }
                          )
                      }

                      Text(
                          text = if (scale > 1.1f) "还原" else "放大",
                          color = WatchSkyBlue,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier
                              .clickable {
                                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                  if (scale > 1.1f) {
                                      scale = 1f
                                      offset = Offset.Zero
                                  } else {
                                      scale = 2.0f
                                  }
                              }
                              .padding(horizontal = 6.dp, vertical = 2.dp)
                      )

                      if (imageUrls.size > 1) {
                          Icon(
                              imageVector = Icons.Default.KeyboardArrowRight,
                              contentDescription = "下一张",
                              tint = if (currentIndex < imageUrls.lastIndex) WatchTextPrimary else WatchTextSecondary,
                              modifier = Modifier
                                  .size(22.dp)
                                  .clickable(enabled = currentIndex < imageUrls.lastIndex) {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      currentIndex += 1
                                      scale = 1f
                                      offset = Offset.Zero
                                  }
                          )
                      }
                  }
              }
          }

