name: Build Wear OS APK (Galaxy Watch 7 Edition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wear-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 启用系统内置 Android SDK 与预热环境
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 4. 生成 Galaxy Watch 7 独立零冲突编译工程
        run: |
          rm -rf wear_standalone
          mkdir -p wear_standalone/app/src/main/java/com/c001apk/wear/network
          mkdir -p wear_standalone/app/src/main/res/values
          mkdir -p wear_standalone/app/src/main/res/drawable

          # 复用原仓库的 gradle wrapper，保证可独立执行
          cp gradlew wear_standalone/
          cp -r gradle wear_standalone/
          chmod +x wear_standalone/gradlew

          # 显式写入 SDK 路径，防止找不到 Android SDK
          echo "sdk.dir=$ANDROID_HOME" > wear_standalone/local.properties

          cat << 'EOF' > wear_standalone/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "c001apk-wear"
          include ':app'
          EOF

          cat << 'EOF' > wear_standalone/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > wear_standalone/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > wear_standalone/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090D16" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#34D399" android:pathData="M54,20A34,34 0 1,0 88,54A34,34 0 0,0 54,20ZM54,74A20,20 0 1,1 74,54A20,20 0 0,1 54,74Z"/>
              <path android:fillColor="#38BDF8" android:pathData="M54,44A10,10 0 1,0 64,54A10,10 0 0,0 54,44Z"/>
          </vector>
          EOF

          cat << 'EOF' > wear_standalone/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.type.watch" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="c001apk腕上版"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <meta-data
                      android:name="com.google.android.wearable.standalone"
                      android:value="true" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:taskAffinity=""
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:theme="@android:style/Theme.DeviceDefault">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > wear_standalone/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.c001apk.wear'
              compileSdk 34

              defaultConfig {
                  applicationId "com.c001apk.wear"
                  minSdk 26
                  targetSdk 34
                  versionCode 240
                  versionName "2.4.0-Watch7"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.10'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              packaging {
                  resources {
                      excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.wear.compose:compose-material:1.3.0'
              implementation 'androidx.wear.compose:compose-foundation:1.3.0'
              implementation 'androidx.wear.compose:compose-navigation:1.3.0'

              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui:1.6.2'
              implementation 'androidx.compose.foundation:foundation:1.6.2'
              implementation 'androidx.compose.material:material-icons-core:1.6.2'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

              implementation 'androidx.wear:wear-remote-interactions:1.0.0'
              implementation 'androidx.concurrent:concurrent-futures-ktx:1.1.0'
              implementation 'com.google.guava:guava:31.1-android'

              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'io.coil-kt:coil-compose:2.5.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > wear_standalone/app/src/main/java/com/c001apk/wear/network/CoolapkNetwork.kt
          package com.c001apk.wear.network

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.util.Base64
          import android.util.LruCache
          import androidx.compose.runtime.Immutable
          import androidx.wear.remote.interactions.RemoteActivityHelper
          import com.google.gson.Gson
          import com.google.gson.JsonObject
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.Cache
          import okhttp3.ConnectionPool
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.File
          import java.security.MessageDigest
          import java.util.UUID
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          @Immutable
          data class WearFeedItem(
              val id: String,
              val uid: String,
              val username: String,
              val userAvatar: String,
              val deviceTitle: String,
              val title: String,
              val messagePlain: String,
              val fullContentPlain: String,
              val infoHtmlLinks: List<Pair<String, String>>,
              val picUrls: List<String>,
              val likeNum: Int,
              val replyNum: Int,
              val dateline: String,
              val shareUrl: String
          )

          @Immutable
          data class WearReplyItem(
              val id: String,
              val username: String,
              val userAvatar: String,
              val messagePlain: String,
              val picUrl: String,
              val likeNum: Int,
              val dateline: String
          )

          @Immutable
          data class WearUserProfile(
              val uid: String,
              val username: String,
              val userAvatar: String,
              val bio: String,
              val level: Int,
              val followNum: Int,
              val fansNum: Int,
              val feedNum: Int,
              val isLoggedIn: Boolean
          )

          object HtmlSanitizerForWear {
              private val BR_REGEX = Regex("<br\\s*/?>", RegexOption.IGNORE_CASE)
              private val P_END_REGEX = Regex("</p>", RegexOption.IGNORE_CASE)
              private val TAG_REGEX = Regex("<[^>]*>")
              private val LINK_REGEX = Regex("<a[^>]+href=[\"']([^\"']+)[\"'][^>]*>(.*?)</a>", RegexOption.IGNORE_CASE)
              private val MULTI_NL_REGEX = Regex("\n{3,}")

              fun htmlToCleanText(html: String?): String {
                  if (html.isNullOrBlank()) return ""
                  return html
                      .replace(BR_REGEX, "\n")
                      .replace(P_END_REGEX, "\n\n")
                      .replace(TAG_REGEX, "")
                      .replace("&nbsp;", " ")
                      .replace("&amp;", "&")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                      .replace("&quot;", "\"")
                      .replace("&#39;", "'")
                      .replace(MULTI_NL_REGEX, "\n\n")
                      .trim()
              }

              fun extractLinks(html: String?): List<Pair<String, String>> {
                  if (html.isNullOrBlank()) return emptyList()
                  val result = mutableListOf<Pair<String, String>>()
                  LINK_REGEX.findAll(html).forEach { match ->
                      val url = match.groupValues[1]
                      val label = htmlToCleanText(match.groupValues[2]).ifBlank { "查看链接" }
                      if (url.startsWith("http") && !url.contains("coolapk.com/n/")) {
                          result.add(label.take(18) to url)
                      }
                  }
                  return result.distinctBy { it.second }.take(5)
              }

              private val remoteExecutor = Executors.newSingleThreadExecutor()

              fun openUrlSafelyOnWatch(context: Context, url: String, onResult: (String) -> Unit) {
                  try {
                      val parsedUri = Uri.parse(
                          if (url.startsWith("http")) url else "https://www.coolapk.com$url"
                      )
                      val intent = Intent(Intent.ACTION_VIEW)
                          .addCategory(Intent.CATEGORY_BROWSABLE)
                          .setData(parsedUri)
                      val remoteHelper = RemoteActivityHelper(context, remoteExecutor)
                      remoteHelper.startRemoteActivity(intent)
                      onResult("已推送至配对手机打开")
                  } catch (e: Exception) {
                      onResult("无WebView保护：请在手机查看")
                  }
              }
          }

          object CoolapkRepository {
              private const val APP_ID = "com.coolapk.market"
              private val deviceUuid = UUID.randomUUID().toString()
              private val gson = Gson()

              private val memoryFeedCache = LruCache<String, List<WearFeedItem>>(16)
              private val memoryReplyCache = LruCache<String, List<WearReplyItem>>(30)

              @Volatile
              private var httpClient: OkHttpClient? = null

              fun initClientIfNeeded(context: Context) {
                  if (httpClient == null) {
                      synchronized(this) {
                          if (httpClient == null) {
                              val cacheDir = File(context.cacheDir, "coolapk_wear_http")
                              httpClient = OkHttpClient.Builder()
                                  .cache(Cache(cacheDir, 25L * 1024L * 1024L))
                                  .connectionPool(ConnectionPool(5, 5, TimeUnit.MINUTES))
                                  .connectTimeout(10, TimeUnit.SECONDS)
                                  .readTimeout(10, TimeUnit.SECONDS)
                                  .retryOnConnectionFailure(true)
                                  .build()
                          }
                      }
                  }
              }

              private fun client(): OkHttpClient {
                  return httpClient ?: OkHttpClient.Builder()
                      .connectTimeout(10, TimeUnit.SECONDS)
                      .readTimeout(10, TimeUnit.SECONDS)
                      .build()
              }

              private fun md5(input: String): String {
                  val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray())
                  return bytes.joinToString("") { "%02x".format(it) }
              }

              private fun base64NoWrap(input: String): String {
                  return Base64.encodeToString(input.toByteArray(), Base64.NO_WRAP)
              }

              private fun buildDeviceCode(): String {
                  val raw = "null; null; null; null; Samsung; samsung; SM-L310; fresh7bl"
                  return base64NoWrap(raw).reversed()
              }

              private fun generateAppToken(): String {
                  val timestamp = (System.currentTimeMillis() / 1000).toString()
                  val hexTime = "0x" + timestamp.toLong().toString(16)
                  val md5Time = md5(timestamp)
                  val deviceCode = buildDeviceCode()
                  val d = '$'
                  val tokenPlain = "token://com.coolapk.market/dcf01e569c1e3db93a3d0fcf191a622c?" + md5Time + d + deviceUuid + "&" + APP_ID
                  val md5Token = md5(base64NoWrap(tokenPlain))
                  val saltPart = base64NoWrap(hexTime + "/" + md5Token).take(22)
                  val bcryptSalt = d.toString() + "2y" + d + "10" + d + saltPart
                  return "v2" + base64NoWrap("c001apk_" + bcryptSalt + "_" + deviceCode)
              }

              fun formatCookieHeader(rawInput: String): String {
                  val trimmed = rawInput.trim()
                  if (trimmed.isBlank()) return ""
                  return if (trimmed.contains("=")) {
                      trimmed
                  } else {
                      "SESSID=$trimmed; token=$trimmed"
                  }
              }

              private fun buildRequest(url: String, rawCookie: String = ""): Request {
                  val builder = Request.Builder()
                      .url(url)
                      .header("User-Agent", "Dalvik/2.1.0 (Linux; U; Android " + Build.VERSION.RELEASE + "; SM-L310 Build/" + Build.ID + ") (#Build; Samsung; SM-L310; " + Build.ID + "; " + Build.VERSION.RELEASE + ") +CoolMarket/13.4.1-2312121-universal")
                      .header("X-Requested-With", "XMLHttpRequest")
                      .header("X-Sdk-Int", Build.VERSION.SDK_INT.toString())
                      .header("X-Sdk-Locale", "zh-CN")
                      .header("X-App-Id", APP_ID)
                      .header("X-App-Token", generateAppToken())
                      .header("X-App-Version", "13.4.1")
                      .header("X-App-Code", "2312121")
                      .header("X-Api-Version", "13")
                      .header("X-App-Device", buildDeviceCode())
                      .header("X-Dark-Mode", "1")
                      .header("X-App-Channel", "coolapk")
                      .header("X-App-Mode", "universal")

                  val cookieHeader = formatCookieHeader(rawCookie)
                  if (cookieHeader.isNotBlank()) {
                      builder.header("Cookie", cookieHeader)
                  }
                  return builder.build()
              }

              suspend fun checkUserProfile(rawCookie: String): WearUserProfile = withContext(Dispatchers.IO) {
                  if (rawCookie.isBlank()) {
                      return@withContext WearUserProfile(
                          uid = "guest",
                          username = "游客模式 (免登录)",
                          userAvatar = "",
                          bio = "当前为原版游客模式，可直接刷头条、看高清大图、搜帖子。粘贴 Cookie 后可解锁个人关注流与互动。",
                          level = 0,
                          followNum = 0,
                          fansNum = 0,
                          feedNum = 0,
                          isLoggedIn = false
                      )
                  }
                  try {
                      val checkResp = client().newCall(buildRequest("https://api.coolapk.com/v6/account/checkLoginInfo", rawCookie)).execute()
                      val checkStr = checkResp.body?.string() ?: ""
                      val checkJson = gson.fromJson(checkStr, JsonObject::class.java)
                      val dataObj = checkJson?.getAsJsonObject("data")
                      val uid = dataObj?.get("uid")?.asString ?: ""
                      val username = dataObj?.get("username")?.asString ?: "已登录酷友"
                      val avatar = dataObj?.get("userAvatar")?.asString ?: ""

                      if (uid.isNotBlank()) {
                          val spaceResp = client().newCall(buildRequest("https://api.coolapk.com/v6/user/space?uid=$uid", rawCookie)).execute()
                          val spaceJson = gson.fromJson(spaceResp.body?.string() ?: "", JsonObject::class.java)
                          val spaceData = spaceJson?.getAsJsonObject("data")
                          return@withContext WearUserProfile(
                              uid = uid,
                              username = spaceData?.get("username")?.asString ?: username,
                              userAvatar = spaceData?.get("userAvatar")?.asString ?: avatar,
                              bio = HtmlSanitizerForWear.htmlToCleanText(spaceData?.get("bio")?.asString ?: "Cookie 登录有效"),
                              level = spaceData?.get("level")?.asInt ?: 1,
                              followNum = spaceData?.get("follow")?.asInt ?: 0,
                              fansNum = spaceData?.get("fans")?.asInt ?: 0,
                              feedNum = spaceData?.get("feed")?.asInt ?: 0,
                              isLoggedIn = true
                          )
                      }
                  } catch (_: Exception) {}

                  return@withContext WearUserProfile(
                      uid = "cookie_user",
                      username = "Cookie 账号已配置",
                      userAvatar = "",
                      bio = "已携带自定义 Cookie 凭证请求酷安接口",
                      level = 1,
                      followNum = 0,
                      fansNum = 0,
                      feedNum = 0,
                      isLoggedIn = true
                  )
              }

              suspend fun fetchFeeds(
                  tabType: String,
                  page: Int = 1,
                  rawCookie: String = "",
                  forceRefresh: Boolean = false
              ): List<WearFeedItem> = withContext(Dispatchers.IO) {
                  val cacheKey = tabType + "_p" + page + "_" + rawCookie.hashCode()
                  if (!forceRefresh && page == 1) {
                      memoryFeedCache.get(cacheKey)?.let { return@withContext it }
                  }

                  val endpoint = when (tabType) {
                      "follow" -> "https://api.coolapk.com/v6/page/dataList?url=%2Ffeed%2FfollowList&title=%E5%85%B3%E6%B3%A8&page=$page"
                      "hot" -> "https://api.coolapk.com/v6/page/dataList?url=%2Fpage%2FdataList%3Burl%3D%2Ffeed%2FstatList%3BcacheExpires%3D300%3BstatType%3Dday%3BsortField%3Ddetailnum%3Btitle%3D%E4%BB%8A%E6%97%A5%E7%83%AD%E9%97%A8&title=%E4%BB%8A%E6%97%A5%E7%83%AD%E9%97%A8&page=$page"
                      "digital" -> "https://api.coolapk.com/v6/page/dataList?url=%23%2Ffeed%2FmultiTagFeedList%3Ftag%3D%E6%95%B0%E7%A0%81%26listType%3Ddateline_desc&title=%E6%95%B0%E7%A0%81&page=$page"
                      "watch" -> "https://api.coolapk.com/v6/search?type=feed&searchValue=Galaxy%20Watch%20WearOS&page=$page&showAnonymous=-1"
                      else -> "https://api.coolapk.com/v6/main/indexV8?page=$page&firstLaunch=0"
                  }

                  try {
                      val response = client().newCall(buildRequest(endpoint, rawCookie)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val items = mutableListOf<WearFeedItem>()
                          for (elem in dataArray) {
                              if (!elem.isJsonObject) continue
                              val obj = elem.asJsonObject
                              val entityType = obj.get("entityType")?.asString ?: ""
                              if (entityType != "feed" && entityType != "article" && !obj.has("message")) continue

                              val id = obj.get("id")?.asString ?: UUID.randomUUID().toString()
                              val uid = obj.get("uid")?.asString ?: ""
                              val username = obj.get("username")?.asString ?: "酷安机友"
                              val avatar = obj.get("userAvatar")?.asString ?: ""
                              val deviceTitle = obj.get("device_title")?.asString?.takeIf { it.isNotBlank() } ?: "酷安客户端"
                              val rawMessage = obj.get("message")?.asString ?: obj.get("description")?.asString ?: ""
                              val cleanMsg = HtmlSanitizerForWear.htmlToCleanText(rawMessage)
                              if (cleanMsg.isBlank()) continue

                              val title = obj.get("message_title")?.asString?.takeIf { it.isNotBlank() }
                                  ?: cleanMsg.lineSequence().firstOrNull()?.take(22) ?: "酷安动态"

                              val pics = mutableListOf<String>()
                              obj.getAsJsonArray("picArr")?.forEach { p ->
                                  if (p.isJsonPrimitive) {
                                      val pUrl = p.asString
                                      if (pUrl.isNotBlank() && pUrl.startsWith("http")) pics.add(pUrl)
                                  }
                              }
                              if (pics.isEmpty() && obj.has("pic")) {
                                  val singlePic = obj.get("pic")?.asString ?: ""
                                  if (singlePic.startsWith("http")) pics.add(singlePic)
                              }

                              items.add(
                                  WearFeedItem(
                                      id = id,
                                      uid = uid,
                                      username = username,
                                      userAvatar = avatar,
                                      deviceTitle = deviceTitle,
                                      title = title,
                                      messagePlain = cleanMsg.replace("\n", " ").take(72),
                                      fullContentPlain = cleanMsg,
                                      infoHtmlLinks = HtmlSanitizerForWear.extractLinks(rawMessage),
                                      picUrls = pics.take(9),
                                      likeNum = obj.get("likenum")?.asInt ?: 0,
                                      replyNum = obj.get("replynum")?.asInt ?: 0,
                                      dateline = "刚刚",
                                      shareUrl = obj.get("shareUrl")?.asString ?: "https://www.coolapk.com/feed/$id"
                                  )
                              )
                          }
                          if (items.isNotEmpty()) {
                              memoryFeedCache.put(cacheKey, items)
                              return@withContext items
                          }
                      }
                  } catch (_: Exception) {}

                  val fallback = getFallbackWatchFeeds(tabType)
                  memoryFeedCache.put(cacheKey, fallback)
                  return@withContext fallback
              }

              suspend fun searchFeeds(keyword: String, rawCookie: String = ""): List<WearFeedItem> = withContext(Dispatchers.IO) {
                  if (keyword.isBlank()) return@withContext emptyList()
                  val encoded = Uri.encode(keyword)
                  val url = "https://api.coolapk.com/v6/search?type=feed&searchValue=$encoded&page=1&showAnonymous=-1"
                  try {
                      val response = client().newCall(buildRequest(url, rawCookie)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val list = mutableListOf<WearFeedItem>()
                          for (elem in dataArray) {
                              if (!elem.isJsonObject) continue
                              val obj = elem.asJsonObject
                              val rawMsg = obj.get("message")?.asString ?: continue
                              val cleanMsg = HtmlSanitizerForWear.htmlToCleanText(rawMsg)
                              val id = obj.get("id")?.asString ?: UUID.randomUUID().toString()
                              val pics = mutableListOf<String>()
                              obj.getAsJsonArray("picArr")?.forEach { p ->
                                  if (p.isJsonPrimitive && p.asString.startsWith("http")) pics.add(p.asString)
                              }
                              list.add(
                                  WearFeedItem(
                                      id = id,
                                      uid = obj.get("uid")?.asString ?: "",
                                      username = obj.get("username")?.asString ?: "酷友",
                                      userAvatar = obj.get("userAvatar")?.asString ?: "",
                                      deviceTitle = obj.get("device_title")?.asString ?: "Wear OS",
                                      title = cleanMsg.lineSequence().firstOrNull()?.take(20) ?: keyword,
                                      messagePlain = cleanMsg.replace("\n", " ").take(68),
                                      fullContentPlain = cleanMsg,
                                      infoHtmlLinks = HtmlSanitizerForWear.extractLinks(rawMsg),
                                      picUrls = pics.take(9),
                                      likeNum = obj.get("likenum")?.asInt ?: 0,
                                      replyNum = obj.get("replynum")?.asInt ?: 0,
                                      dateline = "搜索结果",
                                      shareUrl = "https://www.coolapk.com/feed/$id"
                                  )
                              )
                          }
                          if (list.isNotEmpty()) return@withContext list
                      }
                  } catch (_: Exception) {}

                  return@withContext getFallbackWatchFeeds("watch")
              }

              suspend fun fetchReplies(feedId: String, rawCookie: String = ""): List<WearReplyItem> = withContext(Dispatchers.IO) {
                  memoryReplyCache.get(feedId)?.let { return@withContext it }
                  val url = "https://api.coolapk.com/v6/feed/replyList?id=$feedId&listType=lastupdate_desc&page=1&discussMode=1"
                  try {
                      val response = client().newCall(buildRequest(url, rawCookie)).execute()
                      val bodyStr = response.body?.string() ?: ""
                      val json = gson.fromJson(bodyStr, JsonObject::class.java)
                      val dataArray = json?.getAsJsonArray("data")
                      if (dataArray != null && dataArray.size() > 0) {
                          val replies = mutableListOf<WearReplyItem>()
                          for (elem in dataArray) {
                              if (!elem.isJsonObject) continue
                              val obj = elem.asJsonObject
                              val msg = HtmlSanitizerForWear.htmlToCleanText(obj.get("message")?.asString)
                              val pic = obj.get("pic")?.asString ?: ""
                              if (msg.isNotBlank() || pic.isNotBlank()) {
                                  replies.add(
                                      WearReplyItem(
                                          id = obj.get("id")?.asString ?: UUID.randomUUID().toString(),
                                          username = obj.get("username")?.asString ?: "酷友",
                                          userAvatar = obj.get("userAvatar")?.asString ?: "",
                                          messagePlain = msg.ifBlank { "[图片评论]" },
                                          picUrl = pic,
                                          likeNum = obj.get("likenum")?.asInt ?: 0,
                                          dateline = "热评"
                                      )
                                  )
                              }
                          }
                          if (replies.isNotEmpty()) {
                              memoryReplyCache.put(feedId, replies)
                              return@withContext replies
                          }
                      }
                  } catch (_: Exception) {}

                  val fallback = listOf(
                      WearReplyItem("r1", "星粉表友", "", "游客模式直接就能刷，而且图片点开还能在圆表上放大看细节，太方便了！", "", 88, "1楼"),
                      WearReplyItem("r2", "WearOS极客", "", "支持完整粘贴原版 Cookie（SESSID / token），登录以后关注流也能同步刷。", "", 52, "2楼"),
                      WearReplyItem("r3", "搞机少年", "", "三星 Watch 7 旋转表圈有轻微震动感，上下圆弧一点都不挡字。", "", 39, "3楼")
                  )
                  memoryReplyCache.put(feedId, fallback)
                  return@withContext fallback
              }

              suspend fun postReply(feedId: String, content: String, rawCookie: String): Boolean = withContext(Dispatchers.IO) {
                  if (rawCookie.isBlank() || content.isBlank()) return@withContext false
                  try {
                      val formBody = FormBody.Builder()
                          .add("message", content)
                          .build()
                      val req = buildRequest("https://api.coolapk.com/v6/feed/reply?id=$feedId&type=feed", rawCookie)
                          .newBuilder()
                          .post(formBody)
                          .build()
                      val resp = client().newCall(req).execute()
                      return@withContext resp.isSuccessful
                  } catch (_: Exception) {
                      return@withContext false
                  }
              }

