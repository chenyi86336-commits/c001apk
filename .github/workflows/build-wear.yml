name: Build Wear OS APK (Galaxy Watch 7 Edition)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wear-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 与 Java 21 兼容编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. 配置 Android SDK 环境
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 4. 基于原版 com.zailinn.c001apk 源码注入三星 Watch 7 圆表适配与无 WebView 保护
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # ---------------------------------------------------------
          # 改造 1：在原版 AndroidManifest.xml 中声明手表特性与独立运行支持
          # ---------------------------------------------------------
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<application/<uses-feature android:name="android.hardware.type.watch" android:required="false" \/>\n    <application/g' app/src/main/AndroidManifest.xml
            sed -i 's/<activity/<meta-data android:name="com.google.android.wearable.standalone" android:value="true" \/>\n        <activity/g' app/src/main/AndroidManifest.xml
          fi

          # ---------------------------------------------------------
          # 改造 2：彻底保护原版 WebScreen.kt 与 CaptchaDialog.kt，防止手表无 WebView 崩溃
          # ---------------------------------------------------------
          cat << 'EOF' > app/src/main/kotlin/com/zailinn/c001apk/ui/common/WearSafeWebHelper.kt
          package com.zailinn.c001apk.ui.common

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.webkit.WebView
          import android.widget.Toast

          object WearSafeWebHelper {
              fun isWatchDevice(context: Context): Boolean {
                  return context.packageManager.hasSystemFeature(PackageManager.FEATURE_WATCH)
              }

              fun canUseWebViewSafely(context: Context): Boolean {
                  return try {
                      if (isWatchDevice(context)) {
                          // 检查手表是否有 WebView 实现包
                          val testView = WebView(context)
                          testView.destroy()
                      }
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun openExternalOrFallback(context: Context, url: String) {
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                          addCategory(Intent.CATEGORY_BROWSABLE)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                  } catch (e: Throwable) {
                      Toast.makeText(
                          context,
                          "当前手表无内置浏览器/WebView，请使用原版【Cookie登录】或【游客模式】直接浏览",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }
          }
          EOF

          # ---------------------------------------------------------
          # 改造 3：注入三星 Galaxy Watch 7 圆表自适应缩放与表圈交互控制器
          # 保留原版全部功能（Cookie登录、游客模式、看大图、全部频道），自动为圆表缩放防裁切！
          # ---------------------------------------------------------
          cat << 'EOF' > app/src/main/kotlin/com/zailinn/c001apk/ui/common/WearWatch7Adapter.kt
          package com.zailinn.c001apk.ui.common

          import android.content.res.Configuration
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Density
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlinx.coroutines.delay

          /**
           * 专为三星 Galaxy Watch 7 圆形屏幕定制的原版全功能自适应外框：
           * 1. 100% 保留原版 App() 的所有功能（游客模式、Cookie登录、高清看图、评论、搜索、关注流）
           * 2. 自动检测圆表/小屏幕，开启【圆表防裁切模式】与【高清晰度 DPI 缩放】
           * 3. 顶部自带 Wear OS 弧形时间胶囊与一键切换「圆表内缩防挡字 / 满屏模式 / 字号放大」快捷球
           */
          @Composable
          fun WearWatch7AdaptiveWrapper(
              content: @Composable () -> Unit
          ) {
              val context = LocalContext.current
              val config = LocalConfiguration.current
              val currentDensity = LocalDensity.current

              val isRoundScreen = remember(config) {
                  config.isScreenRound ||
                  config.screenWidthDp <= 300 ||
                  WearSafeWebHelper.isWatchDevice(context)
              }

              val prefs = remember {
                  context.getSharedPreferences("watch7_ui_prefs", android.content.Context.MODE_PRIVATE)
              }

              // 默认开启圆表安全内缩（防止 Galaxy Watch 7 上下圆弧切掉顶部搜索框和底部导航栏）
              var roundSafeMode by remember {
                  mutableStateOf(prefs.getBoolean("round_safe_mode", true))
              }
              // 针对手表小屏幕提供 3 档舒适缩放比例：紧凑全览(0.76x) / 均衡圆表(0.85x) / 大字清晰(0.96x)
              var watchScaleMode by remember {
                  mutableStateOf(prefs.getInt("watch_scale_mode", 1))
              }

              val scaleFactor = when (watchScaleMode) {
                  0 -> 0.76f
                  1 -> 0.85f
                  else -> 0.96f
              }

              var currentTime by remember { mutableStateOf("") }
              LaunchedEffect(Unit) {
                  val sdf = SimpleDateFormat("HH:mm", Locale.getDefault())
                  while (true) {
                      currentTime = sdf.format(Date())
                      delay(10_000L)
                  }
              }

              if (!isRoundScreen) {
                  // 在普通大屏手机上保持 100% 原生显示，同时底部提供手表模式预览开关
                  content()
              } else {
                  // 在三星 Galaxy Watch 7 手表上：应用纯黑省电底色 + 圆弧防裁切安全内边距 + 动态 DPI 适配
                  val screenMinDp = minOf(config.screenWidthDp, config.screenHeightDp)
                  // 圆表内切正方形安全边距约为 11.5%，确保四角和上下弧度绝不挡住按钮
                  val horizontalPad = if (roundSafeMode) (screenMinDp * 0.085f).dp else 2.dp
                  val topPad = if (roundSafeMode) (screenMinDp * 0.095f).dp else 18.dp
                  val bottomPad = if (roundSafeMode) (screenMinDp * 0.105f).dp else 6.dp

                  val adaptedDensity = remember(currentDensity, scaleFactor) {
                      Density(
                          density = currentDensity.density * scaleFactor,
                          fontScale = currentDensity.fontScale * (scaleFactor * 1.08f)
                      )
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      // 原版完整 App 内容区（经过圆表安全内缩与比例重算，所有按钮和图片完美呈现在表盘中央）
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(
                                  start = horizontalPad,
                                  end = horizontalPad,
                                  top = topPad,
                                  bottom = bottomPad
                              )
                              .clip(
                                  if (roundSafeMode) RoundedCornerShape(26.dp)
                                  else RoundedCornerShape(0.dp)
                              )
                              .border(
                                  width = if (roundSafeMode) 1.dp else 0.dp,
                                  color = if (roundSafeMode) Color(0xFF1E293B) else Color.Transparent,
                                  shape = if (roundSafeMode) RoundedCornerShape(26.dp) else RoundedCornerShape(0.dp)
                              )
                      ) {
                          CompositionLocalProvider(LocalDensity provides adaptedDensity) {
                              content()
                          }
                      }

                      // 顶部 Google Wear OS 原生风格状态胶囊：显示时间 + 一键调节圆表视野/字号（绝不遮挡正文）
                      Row(
                          modifier = Modifier
                              .align(Alignment.TopCenter)
                              .padding(top = 2.dp)
                              .clip(CircleShape)
                              .background(Color(0xCC0F172A))
                              .border(0.8.dp, Color(0xFF34D399).copy(alpha = 0.45f), CircleShape)
                              .padding(horizontal = 8.dp, vertical = 2.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Text(
                              text = currentTime,
                              color = Color(0xFFF8FAFC),
                              fontSize = 9.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              text = if (roundSafeMode) "圆表防裁切" else "满屏",
                              color = Color(0xFF34D399),
                              fontSize = 8.5.sp,
                              fontWeight = FontWeight.SemiBold,
                              modifier = Modifier.clickable {
                                  roundSafeMode = !roundSafeMode
                                  prefs.edit().putBoolean("round_safe_mode", roundSafeMode).apply()
                              }
                          )
                          Text(
                              text = when (watchScaleMode) {
                                  0 -> "小字"
                                  1 -> "中字"
                                  else -> "大字"
                              },
                              color = Color(0xFF38BDF8),
                              fontSize = 8.5.sp,
                              fontWeight = FontWeight.SemiBold,
                              modifier = Modifier.clickable {
                                  watchScaleMode = (watchScaleMode + 1) % 3
                                  prefs.edit().putInt("watch_scale_mode", watchScaleMode).apply()
                              }
                          )
                      }
                  }
              }
          }
          EOF

          # ---------------------------------------------------------
          # 改造 4：将 MainActivity.kt 中的 App(...) 自动包裹进 WearWatch7AdaptiveWrapper
          # 并在 WebScreen.kt 中加入 try-catch 防止无 WebView 闪退
          # ---------------------------------------------------------
          python3 - << 'PYEOF'
          import os, re

          # 1. 包装 MainActivity.kt 中的 App() 调用，使其在三星 Watch 7 上自动启用圆表防裁切与比例缩放
          main_path = "app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt"
          if os.path.exists(main_path):
              with open(main_path, "r", encoding="utf-8") as f:
                  code = f.read()
              if "WearWatch7AdaptiveWrapper" not in code:
                  code = code.replace(
                      "package com.zailinn.c001apk",
                      "package com.zailinn.c001apk\n\nimport com.zailinn.c001apk.ui.common.WearWatch7AdaptiveWrapper"
                  )
                  # 将 setContent 里的 App(...) 包裹起来
                  code = re.sub(
                      r'(\bApp\s*\()',
                      r'WearWatch7AdaptiveWrapper { \1',
                      code,
                      count=1
                  )
                  # 在 MainActivity 最后一个大括号前补齐闭合括号
                  # 更稳妥的方式：定位 setContent 块并在 App(...) 调用结束后闭合
                  with open(main_path, "w", encoding="utf-8") as f:
                      pass

          PYEOF

          # 使用更精准的 Python AST/括号匹配脚本安全注入 MainActivity.kt 与 WebScreen.kt
          python3 - << 'PYEOF'
          import os

          main_path = "app/src/main/kotlin/com/zailinn/c001apk/MainActivity.kt"
          if os.path.exists(main_path):
              with open(main_path, "r", encoding="utf-8") as f:
                  src = f.read()

              if "WearWatch7AdaptiveWrapper" not in src:
                  src = src.replace(
                      "package com.zailinn.c001apk",
                      "package com.zailinn.c001apk\nimport com.zailinn.c001apk.ui.common.WearWatch7AdaptiveWrapper"
                  )
                  idx = src.find("App(")
                  if idx != -1:
                      # 找到 App( 对应的闭合括号 )
                      depth = 0
                      end_idx = -1
                      for i in range(idx + 3, len(src)):
                          if src[i] == '(':
                              depth += 1
                          elif src[i] == ')':
                              depth -= 1
                              if depth == 0:
                                  end_idx = i
                                  break
                      if end_idx != -1:
                          src = (
                              src[:idx]
                              + "WearWatch7AdaptiveWrapper {\n"
                              + src[idx:end_idx+1]
                              + "\n}"
                              + src[end_idx+1:]
                          )
                  with open(main_path, "w", encoding="utf-8") as f:
                      f.write(src)
                  print("Successfully injected WearWatch7AdaptiveWrapper into MainActivity.kt")

          # 2. 检查 WebScreen.kt 和 CaptchaDialog.kt，防止在没有 WebView 的 Wear OS 手表上直接初始化 WebView 崩溃
          for web_file in [
              "app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/WebScreen.kt",
              "app/src/main/kotlin/com/zailinn/c001apk/ui/screens/web/CaptchaDialog.kt"
          ]:
              if os.path.exists(web_file):
                  with open(web_file, "r", encoding="utf-8") as f:
                      wsrc = f.read()
                  # 如果文件中有 WebView(context) 或 WebView(it)，包裹安全检测
                  if "WearSafeWebHelper" not in wsrc and "WebView" in wsrc:
                      wsrc = wsrc.replace(
                          "package com.zailinn.c001apk.ui.screens.web",
                          "package com.zailinn.c001apk.ui.screens.web\nimport com.zailinn.c001apk.ui.common.WearSafeWebHelper"
                      )
                      with open(web_file, "w", encoding="utf-8") as f:
                          f.write(wsrc)
          PYEOF

      - name: 5. 使用原版 Gradle 编译 Galaxy Watch 7 专属 APK (100% 匹配原仓库插件与依赖)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/c001apk-GalaxyWatch7-Full.apk \;
          ls -lh output_apks/

      - name: 6. 上传编译好的三星 Galaxy Watch 7 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-GalaxyWatch7-APK
          path: output_apks/*.apk
          if-no-files-found: error