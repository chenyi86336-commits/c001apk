                              FilledTonalButton(
                                  onClick = {
                                      val url = urls.getOrNull(index) ?: return@FilledTonalButton
                                      if (saving) return@FilledTonalButton
                                      saving = true
                                      message = null
                                      scope.launch {
                                          val result = container.saveImage(context, url)
                                          saving = false
                                          message = if (result.isSuccess) "已保存到相册" else "保存失败，请检查网络"
                                      }
                                  },
                                  enabled = !saving && urls.isNotEmpty(),
                              ) {
                                  Text(if (saving) "保存中…" else "保存当前图片")
                              }
                          }
                      }
                  }
              }
              '''
              account = account[:start] + new_tail
          else:
              print('Gallery fix already present; checking and retaining it.')

          # Add only imports needed by the new gallery and edge-swipe implementation.
          needed_imports = [
              'import androidx.activity.compose.BackHandler',
              'import androidx.compose.foundation.gestures.awaitEachGesture',
              'import androidx.compose.foundation.gestures.awaitFirstDown',
              'import androidx.compose.ui.input.pointer.PointerEventPass',
              'import androidx.compose.ui.input.pointer.pointerInput',
              'import androidx.compose.foundation.layout.Arrangement',
              'import androidx.compose.foundation.layout.Row',
              'import androidx.compose.foundation.layout.Box',
          ]
          for imp in needed_imports:
              if imp not in account:
                  # Insert imports before the first existing import; package line remains unchanged.
                  first = account.find('\nimport ')
                  if first < 0:
                      raise SystemExit('AccountScreens.kt has no import section')
                  account = account[:first + 1] + imp + '\n' + account[first + 1:]
          # ScreenScaffold / EdgeButton were already imported, but preserve a clear validation.
          for required in ('import androidx.wear.compose.material3.ScreenScaffold', 'import androidx.wear.compose.material3.EdgeButton', 'import androidx.wear.compose.material3.FilledTonalButton'):
              if required not in account:
                  account = account.replace('import androidx.wear.compose.material3.', required.split('.')[-1] + '\nimport androidx.wear.compose.material3.', 1) if 'import androidx.wear.compose.material3.' in account else account
                  if required not in account:
                      raise SystemExit(f'Required Material 3 import missing: {required}')
          account = account.replace('import androidx.compose.ui.graphics.Color\n', '')
          account_path.write_text(account, encoding='utf-8')

          app = app_path.read_text(encoding='utf-8')
          old_route = 'composable("images") { ImageViewerScreen(args.images, args.imageIndex, container) }'
          new_route = '''composable("images") {
                                  ImageViewerScreen(
                                      urls = args.images,
                                      startIndex = args.imageIndex,
                                      container = container,
                                      onBack = {
                                          // Return to the exact previous destination (feed, user, or post).
                                          // Do not route to Home and do not trigger any feed refresh here.
                                          if (!navController.popBackStack()) {
                                              navController.navigate("home") { launchSingleTop = true }
                                          }
                                      },
                                  )
                              }'''
          if old_route in app:
              app = app.replace(old_route, new_route, 1)
          elif new_route not in app:
              raise SystemExit('Expected images route was not found; refusing a broad navigation rewrite')
          app_path.write_text(app, encoding='utf-8')

          gradle = gradle_path.read_text(encoding='utf-8')
          if 'versionName = "0.6.26"' in gradle and 'versionCode = 2026110106' in gradle:
              gradle = gradle.replace('versionName = "0.6.26"', 'versionName = "0.6.30"', 1)
              gradle = gradle.replace('versionCode = 2026110106', 'versionCode = 2026110110', 1)
          elif not ('versionName = "0.6.30"' in gradle and 'versionCode = 2026110110' in gradle):
              raise SystemExit('Unexpected version baseline; refusing to overwrite an unrelated version')
          if 'abiFilters.add("armeabi-v7a")' not in gradle or 'geckoview-armeabi-v7a:159.0.20261022150525' not in gradle:
              raise SystemExit('ARMv7 ABI filter or GeckoView dependency changed unexpectedly')
          gradle_path.write_text(gradle, encoding='utf-8')

          # Focused source-level regressions: gallery paging stays enabled for multiple images,
          # system back and edge back are both present, and back pops the actual previous route.
          account = account_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          checks = {
              'system_back_handler': 'BackHandler(enabled = true, onBack = onBack)' in account,
              'edge_swipe_detected_on_initial_pass': 'awaitFirstDown(requireUnconsumed = false, pass = PointerEventPass.Initial)' in account and 'awaitPointerEvent(PointerEventPass.Initial)' in account,
              'edge_swipe_consumes_before_pager': 'change.consume()' in account and 'HorizontalPager(' in account,
              'visible_material3_back_button': 'EdgeButton(onClick = onBack)' in account,
              'multi_image_swipe_preserved': 'userScrollEnabled = urls.size > 1' in account,
              'material3_dynamic_surface_colors': 'MaterialTheme.colorScheme.surfaceContainerHigh' in account and 'MaterialTheme.colorScheme.onSurface' in account,
              'correct_back_stack_pop': 'if (!navController.popBackStack())' in app,
              'new_version_name': 'versionName = "0.6.30"' in gradle,
              'new_version_code': 'versionCode = 2026110110' in gradle,
              'armv7_only_filter_preserved': 'abiFilters.add("armeabi-v7a")' in gradle,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if not all(checks.values()):
              raise SystemExit('One or more gallery/navigation/version guards failed')
          print('Wear OS 0.6.30 gallery back navigation + Material 3 patch applied.')
          PY
          WEAR_0627_FIX
          bash "$RUNNER_TEMP/wear-os-0.6.30-gallery-fix.sh"
      - name: Fix verified Wear OS 0.6.30 Kotlin compile errors (Uri + Wear Material3 Surface)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX'
          from pathlib import Path

          base = Path("wear/src/main/kotlin/com/zailinn/c001apk/wear")
          social_path = base / "SocialScreens.kt"
          social = social_path.read_text(encoding="utf-8")
          if "import android.net.Uri\n" not in social:
              anchor = "import android.graphics.BitmapFactory\n"
              if anchor not in social:
                  raise SystemExit("Cannot add Uri import: BitmapFactory import anchor not found")
              social = social.replace(anchor, anchor + "import android.net.Uri\n", 1)
          if "uri: Uri" not in social or "import android.net.Uri" not in social:
              raise SystemExit("SocialScreens Uri import fix verification failed")
          social_path.write_text(social, encoding="utf-8")

          login_path = base / "WearNativeLoginScreen.kt"
          login = login_path.read_text(encoding="utf-8")
          login = login.replace(
              "import androidx.wear.compose.material3.Surface\n",
              "import androidx.compose.foundation.background\n",
          )
          old = ("    Surface(\n"
                 "        modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp),\n"
                 "        shape = RoundedCornerShape(20.dp),\n"
                 "        color = MaterialTheme.colorScheme.surfaceContainerLow,\n"
                 "    ) {\n")
          new = ("    Box(\n"
                 "        modifier = Modifier.fillMaxWidth()\n"
                 "            .padding(horizontal = 12.dp)\n"
                 "            .clip(RoundedCornerShape(20.dp))\n"
                 "            .background(MaterialTheme.colorScheme.surfaceContainerLow),\n"
                 "    ) {\n")
          if old in login:
              login = login.replace(old, new, 1)
          if "import androidx.wear.compose.material3.Surface" in login or "    Surface(" in login:
              raise SystemExit("Wear Material3 Surface replacement was not fully applied")
          if "import androidx.compose.foundation.background" not in login or ".background(MaterialTheme.colorScheme.surfaceContainerLow)" not in login:
              raise SystemExit("Wear login MD3 container replacement verification failed")
          login_path.write_text(login, encoding="utf-8")
          print("Fixed verified Kotlin issues: android.net.Uri import and unsupported Wear Material3 Surface usage")
          PY_FIX
          grep -q 'import android.net.Uri' wear/src/main/kotlin/com/zailinn/c001apk/wear/SocialScreens.kt
          ! grep -q 'androidx.wear.compose.material3.Surface' wear/src/main/kotlin/com/zailinn/c001apk/wear/WearNativeLoginScreen.kt
          grep -q 'background(MaterialTheme.colorScheme.surfaceContainerLow)' wear/src/main/kotlin/com/zailinn/c001apk/wear/WearNativeLoginScreen.kt

      - name: Replace Wear OS 0.6.30 CAPTCHA page with trusted-origin GeckoView extension (fix blank Yidun widget)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAPTCHA_0630'
          from pathlib import Path
          import base64
          files = {
              'wear/src/main/kotlin/com/zailinn/c001apk/wear/WearCaptchaBrowser.kt': '',
